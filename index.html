<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>WebOS · Aurora</title>
<style>
/* ================= 基础变量与动画体系 ================= */
:root{
  --ease:cubic-bezier(.22,1,.36,1);       /* 统一弹簧缓动 */
  --ease-in:cubic-bezier(.55,.06,.68,.19);
  --t-fast:.15s; --t-med:.28s; --t-slow:.45s;
  --accent:#e0912f; --accent-2:#c65a28;
  --radius:14px; --tb-h:56px;
  --panel:rgba(28,23,18,.84);
  --glass-blur:blur(22px) saturate(1.4);
  --text:#f0ebe1; --text-dim:#a99d8b;
  --line:rgba(255,236,210,.09);
  --hover:rgba(255,236,210,.07);
  --win-bg:#292319;
  --input-bg:rgba(255,236,210,.06);
  --shadow-win:0 18px 50px rgba(12,8,4,.5),0 2px 10px rgba(12,8,4,.32);
  --wall:linear-gradient(160deg,#1a1410,#2b2118,#3d2b1e);
}
[data-theme="light"]{
  --panel:rgba(252,249,243,.85);
  --text:#2b251c; --text-dim:#7b7161;
  --line:rgba(92,70,40,.1);
  --hover:rgba(92,70,40,.06);
  --win-bg:#fbf8f1;
  --input-bg:rgba(92,70,40,.05);
  --shadow-win:0 18px 50px rgba(70,50,25,.22),0 2px 10px rgba(70,50,25,.12);
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{height:100%;overflow:hidden;}
body{
  font-family:-apple-system,"Segoe UI","PingFang SC","Microsoft YaHei","Noto Sans SC",sans-serif;
  color:var(--text);background:#14100b;user-select:none;
}
body.no-select{user-select:none !important;}
body.dragging, body.dragging *{cursor:grabbing !important;}
button{font-family:inherit;}
input,textarea,select{font-family:inherit;}
::-webkit-scrollbar{width:9px;height:9px;}
::-webkit-scrollbar-thumb{background:rgba(170,155,135,.35);border-radius:6px;border:2px solid transparent;background-clip:content-box;}
::-webkit-scrollbar-thumb:hover{background:rgba(170,155,135,.55);border:2px solid transparent;background-clip:content-box;}
::-webkit-scrollbar-track{background:transparent;}

/* ================= 桌面 ================= */
#desktop{position:fixed;inset:0;background:var(--wall);background-size:cover;transition:background var(--t-slow) ease;}
#desk-icons{position:absolute;inset:14px 14px calc(var(--tb-h) + 14px) 14px;display:grid;
  grid-auto-flow:column;grid-template-rows:repeat(auto-fill,100px);grid-auto-columns:90px;
  gap:4px;justify-content:start;align-content:start;overflow:hidden;}
.dicon{display:flex;flex-direction:column;align-items:center;gap:7px;padding:10px 4px 8px;
  background:transparent;border:none;border-radius:12px;cursor:pointer;
  transition:background var(--t-fast),transform var(--t-fast);
  animation:tileIn .4s var(--ease) backwards;animation-delay:var(--d,0ms);}
.dicon:hover{background:rgba(255,255,255,.12);}
.dicon:active{transform:scale(.94);}
.dicon .app-ic{width:50px;height:50px;font-size:26px;border-radius:15px;}
.dicon .app-t{font-size:12px;color:#fff;text-shadow:0 1px 5px rgba(0,0,0,.55);
  max-width:84px;text-align:center;overflow:hidden;text-overflow:ellipsis;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;white-space:normal;line-height:1.3;}
.app-ic{display:grid;place-items:center;border-radius:12px;color:#fff;flex:0 0 auto;
  box-shadow:0 4px 14px rgba(0,0,0,.25),inset 0 1px 0 rgba(255,255,255,.28);font-size:22px;line-height:1;}
@keyframes tileIn{from{opacity:0;transform:translateY(12px) scale(.92);}}

/* ================= 开机画面 ================= */
#boot{position:fixed;inset:0;background:#14100b;z-index:9999;display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:20px;transition:opacity .55s ease;}
#boot.out{opacity:0;pointer-events:none;}
.boot-logo{width:86px;height:86px;border-radius:24px;display:grid;place-items:center;
  font-size:44px;font-weight:800;color:#fff;
  background:linear-gradient(135deg,var(--accent),var(--accent-2));
  box-shadow:0 20px 60px rgba(224,145,47,.42);animation:bootPop .6s var(--ease);}
.boot-name{font-size:23px;font-weight:700;color:#eef2f9;letter-spacing:.5px;}
.boot-tag{font-size:12px;color:#8b93a7;letter-spacing:2px;}
.boot-bar{width:180px;height:4px;border-radius:3px;background:rgba(255,255,255,.12);overflow:hidden;}
.boot-bar i{display:block;height:100%;width:40%;border-radius:3px;
  background:linear-gradient(90deg,var(--accent),var(--accent-2));
  animation:bootSlide 1s ease-in-out infinite;}
@keyframes bootSlide{0%{transform:translateX(-120%)}100%{transform:translateX(330%)}}
@keyframes bootPop{from{transform:scale(.55);opacity:0}}

/* ================= 窗口 ================= */
#win-layer{position:fixed;inset:0 0 var(--tb-h) 0;pointer-events:none;z-index:100;}
.win{position:fixed;top:0;left:0;pointer-events:auto;display:flex;flex-direction:column;
  min-width:220px;min-height:150px;border-radius:var(--radius);
  background:var(--win-bg);border:1px solid var(--line);box-shadow:var(--shadow-win);
  contain:layout style;}
.win.focused{border-color:rgba(214,178,120,.3);
  box-shadow:0 26px 72px rgba(12,8,4,.55),0 4px 16px rgba(12,8,4,.34);}
[data-theme="light"] .win.focused{box-shadow:0 26px 72px rgba(70,50,25,.26),0 4px 16px rgba(70,50,25,.14);}
.win.maxed{border-radius:0;border:none;}
.win.anim{transition:transform var(--t-med) var(--ease),width var(--t-med) var(--ease),height var(--t-med) var(--ease);}
.win.dragging{will-change:transform;}
.tb{height:42px;flex:0 0 42px;display:flex;align-items:center;gap:10px;padding:0 8px 0 13px;
  position:relative;z-index:10;touch-action:none;border-bottom:1px solid var(--line);}
.tb-ic{width:22px;height:22px;border-radius:7px;display:grid;place-items:center;font-size:12px;flex:0 0 22px;}
.tb-title{font-size:13px;font-weight:600;color:var(--text);flex:1;min-width:0;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.tb-btns{display:flex;gap:2px;}
.wbtn{width:30px;height:30px;border:none;background:transparent;border-radius:8px;
  color:var(--text-dim);cursor:pointer;display:grid;place-items:center;
  transition:background var(--t-fast),color var(--t-fast),transform var(--t-fast);}
.wbtn:hover{background:var(--hover);color:var(--text);}
.wbtn:active{transform:scale(.88);}
.wbtn.min::before{content:'';width:11px;height:1.6px;background:currentColor;border-radius:2px;}
.wbtn.max::before{content:'';width:10px;height:10px;border:1.6px solid currentColor;border-radius:3px;}
.wbtn.cls::before{content:'\00d7';font-size:19px;line-height:1;margin-top:-2px;}
.wbtn.cls:hover{background:#e5484d;color:#fff;}
.wbody{flex:1;min-height:0;position:relative;overflow:hidden;z-index:1;
  border-radius:0 0 var(--radius) var(--radius);}
.win.maxed .wbody{border-radius:0;}
.rz{position:absolute;z-index:20;touch-action:none;}
.rz-n{top:-4px;left:10px;right:10px;height:9px;cursor:ns-resize;}
.rz-s{bottom:-4px;left:10px;right:10px;height:9px;cursor:ns-resize;}
.rz-e{right:-4px;top:10px;bottom:10px;width:9px;cursor:ew-resize;}
.rz-w{left:-4px;top:10px;bottom:10px;width:9px;cursor:ew-resize;}
.rz-ne{top:-5px;right:-5px;width:14px;height:14px;cursor:nesw-resize;}
.rz-nw{top:-5px;left:-5px;width:14px;height:14px;cursor:nwse-resize;}
.rz-se{bottom:-5px;right:-5px;width:14px;height:14px;cursor:nwse-resize;}
.rz-sw{bottom:-5px;left:-5px;width:14px;height:14px;cursor:nesw-resize;}
.win.maxed .rz{display:none;}
#snap-preview{position:fixed;top:0;left:0;border-radius:14px;z-index:400;pointer-events:none;
  background:rgba(224,160,80,.16);border:1.5px solid rgba(232,184,116,.55);
  backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);
  opacity:0;transition:opacity .16s ease,transform .22s var(--ease),width .22s var(--ease),height .22s var(--ease);}
#snap-preview.show{opacity:1;}

/* ================= 任务栏 ================= */
#taskbar{position:fixed;left:0;right:0;bottom:0;height:var(--tb-h);z-index:5000;
  display:flex;align-items:center;gap:6px;padding:0 10px;
  background:var(--panel);backdrop-filter:var(--glass-blur);-webkit-backdrop-filter:var(--glass-blur);
  border-top:1px solid var(--line);}
#start-btn{width:44px;height:44px;border:none;border-radius:12px;cursor:pointer;flex:0 0 44px;
  background:linear-gradient(135deg,var(--accent),var(--accent-2));color:#fff;
  font-size:20px;font-weight:800;display:grid;place-items:center;
  box-shadow:0 6px 18px rgba(224,145,47,.35),inset 0 1px 0 rgba(255,255,255,.3);
  transition:transform var(--t-fast) var(--ease),box-shadow var(--t-fast),filter var(--t-fast);}
#start-btn:hover{filter:brightness(1.1);box-shadow:0 8px 24px rgba(224,145,47,.5);}
#start-btn:active{transform:scale(.9);}
#start-btn.on{transform:scale(.92);filter:brightness(1.15);}
#task-apps{flex:1;min-width:0;display:flex;align-items:center;gap:4px;overflow:hidden;}
.tk-btn{display:flex;align-items:center;gap:8px;max-width:168px;min-width:0;flex:0 1 auto;
  padding:7px 10px;background:transparent;border:none;border-radius:10px;color:var(--text);
  cursor:pointer;position:relative;transition:background var(--t-fast),opacity var(--t-fast),transform var(--t-fast);}
.tk-btn:hover{background:var(--hover);}
.tk-btn:active{transform:scale(.96);}
.tk-btn.active{background:var(--hover);}
.tk-btn.active::after{content:'';position:absolute;left:12px;right:12px;bottom:2px;height:3px;
  border-radius:2px;background:var(--accent);animation:dotIn .3s var(--ease);}
.tk-btn.minned{opacity:.6;}
.tk-ic{width:22px;height:22px;border-radius:7px;display:grid;place-items:center;font-size:12px;flex:0 0 22px;}
.tk-t{font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.tk-btn.pop{animation:tkPop .32s var(--ease);}
.tk-btn.bye{opacity:0;transform:scale(.7) translateY(8px);transition:opacity .16s,transform .16s var(--ease-in);}
@keyframes tkPop{from{transform:translateY(16px) scale(.75);opacity:0}}
@keyframes dotIn{from{transform:scaleX(0)}}
#tray{flex:0 0 auto;display:flex;align-items:center;gap:8px;}
#tk-clock{border:none;background:transparent;color:var(--text);cursor:pointer;border-radius:10px;
  padding:6px 12px;text-align:right;transition:background var(--t-fast);}
#tk-clock:hover{background:var(--hover);}
#tk-time{font-size:14px;font-weight:700;font-variant-numeric:tabular-nums;}
#tk-day{font-size:10.5px;color:var(--text-dim);margin-top:1px;}

/* ================= 开始菜单 ================= */
#startmenu{position:fixed;left:12px;bottom:calc(var(--tb-h) + 12px);width:540px;
  max-width:calc(100vw - 24px);max-height:min(660px,calc(100vh - var(--tb-h) - 24px));
  background:var(--panel);backdrop-filter:var(--glass-blur);-webkit-backdrop-filter:var(--glass-blur);
  border:1px solid var(--line);border-radius:20px;box-shadow:0 30px 80px rgba(0,0,0,.5);
  z-index:4500;padding:18px;display:flex;flex-direction:column;gap:12px;
  opacity:0;transform:translateY(18px) scale(.97);transform-origin:bottom left;
  pointer-events:none;transition:opacity var(--t-med) var(--ease),transform var(--t-med) var(--ease);}
#startmenu.show{opacity:1;transform:none;pointer-events:auto;}
#sm-search{height:38px;border-radius:11px;border:1px solid var(--line);background:var(--input-bg);
  color:var(--text);padding:0 14px;font-size:13px;outline:none;flex:1;
  transition:border-color .2s,box-shadow .2s;}
#sm-search:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(224,145,47,.22);}
.sm-title{font-size:12px;font-weight:600;color:var(--text-dim);padding:0 4px;}
#sm-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:4px;overflow-y:auto;padding:2px;min-height:0;}
.sm-tile{display:flex;flex-direction:column;align-items:center;gap:8px;padding:12px 4px 10px;
  background:transparent;border:none;border-radius:12px;cursor:pointer;
  transition:background var(--t-fast),transform var(--t-fast);
  animation:tileIn .32s var(--ease) backwards;animation-delay:var(--d,0ms);}
.sm-tile:hover{background:var(--hover);}
.sm-tile:active{transform:scale(.93);}
.sm-tile .app-ic{width:42px;height:42px;font-size:21px;border-radius:13px;}
.sm-tile .app-t{font-size:12px;color:var(--text);max-width:88px;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.sm-empty{grid-column:1/-1;text-align:center;color:var(--text-dim);font-size:13px;padding:30px 0;}
.sm-foot{display:flex;align-items:center;justify-content:space-between;border-top:1px solid var(--line);padding-top:12px;}
.sm-user{display:flex;align-items:center;gap:10px;font-size:13px;font-weight:600;}
.sm-ava{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;font-size:16px;
  background:linear-gradient(135deg,#f6b73c,#f68c3c);box-shadow:0 4px 12px rgba(246,140,60,.35);}
.sm-actions{display:flex;gap:4px;}
.sm-actions button{width:34px;height:34px;border:none;border-radius:9px;background:transparent;
  cursor:pointer;display:grid;place-items:center;color:var(--text-dim);font-size:14px;
  transition:background var(--t-fast),color var(--t-fast),transform var(--t-fast);}
.sm-actions button:hover{background:var(--hover);color:var(--text);}
.sm-actions button:active{transform:scale(.9);}

/* ================= 托盘日历弹窗 ================= */
#tray-pop{position:fixed;right:12px;bottom:calc(var(--tb-h) + 12px);width:300px;z-index:4600;
  background:var(--panel);backdrop-filter:var(--glass-blur);-webkit-backdrop-filter:var(--glass-blur);
  border:1px solid var(--line);border-radius:18px;box-shadow:0 26px 70px rgba(0,0,0,.45);
  padding:16px;opacity:0;transform:translateY(16px) scale(.97);transform-origin:bottom right;
  pointer-events:none;transition:opacity var(--t-med) var(--ease),transform var(--t-med) var(--ease);}
#tray-pop.show{opacity:1;transform:none;pointer-events:auto;}
.cal-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;}
.cal-title{font-size:14px;font-weight:700;}
.cal-nav{display:flex;gap:4px;}
.cal-nav button{width:28px;height:28px;border:none;border-radius:8px;background:transparent;
  color:var(--text-dim);cursor:pointer;font-size:14px;transition:background var(--t-fast),color var(--t-fast);}
.cal-nav button:hover{background:var(--hover);color:var(--text);}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;text-align:center;}
.cal-dow{font-size:10.5px;color:var(--text-dim);padding:5px 0;}
.cal-d{font-size:12px;padding:7px 0;border-radius:8px;font-variant-numeric:tabular-nums;
  transition:background var(--t-fast);}
.cal-d.today{background:var(--accent);color:#fff;font-weight:700;}
.cal-d.dim{color:var(--text-dim);opacity:.45;}

/* ================= 桌面右键菜单 / 通用弹层 ================= */
#ctx-menu{position:fixed;z-index:9000;min-width:190px;
  background:var(--panel);backdrop-filter:var(--glass-blur);-webkit-backdrop-filter:var(--glass-blur);
  border:1px solid var(--line);border-radius:13px;padding:6px;
  box-shadow:0 18px 50px rgba(0,0,0,.4);
  opacity:0;transform:scale(.94);transform-origin:top left;pointer-events:none;
  transition:opacity .15s var(--ease),transform .15s var(--ease);}
#ctx-menu.show{opacity:1;transform:none;pointer-events:auto;}
.ctx-item{display:flex;align-items:center;gap:10px;width:100%;padding:9px 12px;border:none;
  background:transparent;border-radius:8px;color:var(--text);font-size:13px;cursor:pointer;
  text-align:left;transition:background .12s;}
.ctx-item:hover{background:var(--hover);}

/* ================= 通知 Toast ================= */
#toasts{position:fixed;top:16px;right:16px;z-index:9500;display:flex;flex-direction:column;gap:10px;pointer-events:none;}
.toast{display:flex;align-items:center;gap:10px;background:var(--panel);
  backdrop-filter:var(--glass-blur);-webkit-backdrop-filter:var(--glass-blur);
  border:1px solid var(--line);color:var(--text);padding:10px 16px;border-radius:12px;
  font-size:13px;box-shadow:0 12px 34px rgba(0,0,0,.35);max-width:320px;
  transform:translateX(120%);opacity:0;
  transition:transform .4s var(--ease),opacity .3s;}
.toast.in{transform:none;opacity:1;}
.t-ic{font-size:16px;flex:0 0 auto;}

/* ================= 关机遮罩 ================= */
#shutdown{position:fixed;inset:0;background:#0b0906;z-index:9800;display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:20px;opacity:0;pointer-events:none;transition:opacity .45s ease;}
#shutdown.show{opacity:1;pointer-events:auto;}
.sd-btn{width:80px;height:80px;border-radius:50%;border:2px solid rgba(255,255,255,.25);
  background:rgba(255,255,255,.05);color:#dfe5f0;cursor:pointer;display:grid;place-items:center;
  transition:all .3s var(--ease);}
.sd-btn:hover{border-color:var(--accent);color:#fff;
  box-shadow:0 0 0 10px rgba(224,145,47,.12);transform:scale(1.06);}
.sd-btn svg{width:32px;height:32px;}
.sd-text{color:#8b93a7;font-size:13px;letter-spacing:1px;}

/* ================= 通用控件 ================= */
.fbtn{height:30px;padding:0 12px;border-radius:9px;border:1px solid var(--line);
  background:transparent;color:var(--text);font-size:12px;cursor:pointer;white-space:nowrap;
  transition:background var(--t-fast),border-color var(--t-fast),transform var(--t-fast);}
.fbtn:hover{background:var(--hover);}
.fbtn:active{transform:scale(.95);}
.fbtn.danger{color:#ff7a7f;border-color:rgba(229,72,77,.35);}
.fbtn.danger:hover{background:rgba(229,72,77,.14);}
.fbtn.primary{background:var(--accent);border-color:var(--accent);color:#fff;}
.fbtn.primary:hover{filter:brightness(1.08);}
.mini-dlg{position:absolute;inset:0;background:rgba(10,12,18,.45);backdrop-filter:blur(3px);
  display:none;align-items:center;justify-content:center;z-index:50;}
.mini-dlg.show{display:flex;animation:fadeIn .18s ease;}
.mini-dlg .dlg-box{width:320px;background:var(--win-bg);border:1px solid var(--line);
  border-radius:14px;padding:18px;box-shadow:0 20px 50px rgba(0,0,0,.4);
  animation:dlgPop .22s var(--ease);}
@keyframes dlgPop{from{transform:scale(.92) translateY(8px);opacity:0}}
@keyframes fadeIn{from{opacity:0}}

/* ================= 应用市场 ================= */
.app-store{display:flex;flex-direction:column;height:100%;}
.st-head{padding:18px 20px 8px;flex:0 0 auto;}
.st-hero{font-size:22px;font-weight:800;letter-spacing:.3px;}
.st-sub{font-size:12px;color:var(--text-dim);margin:3px 0 14px;}
.st-tools{display:flex;gap:8px;align-items:center;flex-wrap:wrap;}
.st-search{flex:1;min-width:150px;max-width:260px;height:34px;border-radius:10px;
  border:1px solid var(--line);background:var(--input-bg);color:var(--text);
  padding:0 12px;font-size:13px;outline:none;transition:border-color .2s,box-shadow .2s;}
.st-search:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(224,145,47,.2);}
.st-chip{height:30px;padding:0 14px;border-radius:15px;border:1px solid var(--line);
  background:transparent;color:var(--text-dim);font-size:12px;cursor:pointer;
  transition:all .2s var(--ease);}
.st-chip:hover{color:var(--text);border-color:var(--text-dim);}
.st-chip.on{background:var(--accent);border-color:var(--accent);color:#fff;}
.st-grid{flex:1;overflow-y:auto;display:grid;grid-template-columns:repeat(auto-fill,minmax(252px,1fr));
  gap:12px;padding:14px 20px 20px;align-content:start;}
.st-card{display:flex;flex-direction:column;gap:10px;padding:16px;border:1px solid var(--line);
  border-radius:16px;background:var(--hover);
  transition:transform .25s var(--ease),box-shadow .25s var(--ease),border-color .25s;
  animation:tileIn .4s var(--ease) backwards;animation-delay:var(--d,0ms);}
.st-card:hover{transform:translateY(-3px);box-shadow:0 16px 38px rgba(12,8,4,.3);
  border-color:rgba(226,168,96,.45);}
.st-top{display:flex;gap:12px;align-items:center;}
.st-ic{width:52px;height:52px;font-size:26px;border-radius:14px;}
.st-name{font-size:15px;font-weight:700;}
.st-meta{font-size:11px;color:var(--text-dim);margin-top:4px;display:flex;gap:8px;flex-wrap:wrap;}
.st-cat{padding:1px 7px;border-radius:8px;background:var(--hover);border:1px solid var(--line);}
.st-desc{font-size:12px;color:var(--text-dim);line-height:1.6;min-height:38px;}
.st-foot{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:auto;}
.st-size{font-size:11px;color:var(--text-dim);}
.st-btns{display:flex;gap:8px;}
.st-btn{height:32px;padding:0 16px;border-radius:16px;border:none;background:var(--accent);
  color:#fff;font-size:12px;font-weight:600;cursor:pointer;position:relative;overflow:hidden;
  transition:transform .18s var(--ease),filter .18s,background .2s,border-color .2s;}
.st-btn:hover{filter:brightness(1.1);}
.st-btn:active{transform:scale(.94);}
.st-btn.ghost{background:transparent;border:1px solid var(--line);color:var(--text);}
.st-btn.ghost:hover{border-color:var(--text-dim);filter:none;}
.st-btn.confirm{background:#e5484d;border-color:#e5484d;}
.st-btn.installing{background:var(--hover);border:1px solid var(--line);cursor:default;min-width:100px;}
.pbar{position:absolute;inset:0;background:transparent;}
.pfill{position:absolute;inset:0;background:rgba(224,145,47,.4);transform-origin:left;transform:scaleX(0);}
.st-btn .ptext{position:relative;z-index:1;font-size:11px;color:var(--text);}
.st-note{grid-column:1/-1;text-align:center;color:var(--text-dim);font-size:12px;padding:26px 0;}

/* ================= 文件管理器 ================= */
.app-files{display:flex;flex-direction:column;height:100%;}
.fi-bar{display:flex;gap:6px;align-items:center;padding:10px 12px;border-bottom:1px solid var(--line);flex:0 0 auto;flex-wrap:wrap;}
.fi-crumbs{flex:1;min-width:120px;display:flex;align-items:center;gap:2px;overflow:hidden;
  background:var(--input-bg);border:1px solid var(--line);border-radius:9px;padding:5px 10px;font-size:12px;}
.crumb{border:none;background:transparent;color:var(--text);cursor:pointer;font-size:12px;
  padding:2px 5px;border-radius:6px;white-space:nowrap;transition:background var(--t-fast);}
.crumb:hover{background:var(--hover);}
.crumb-sep{color:var(--text-dim);}
.fi-list{flex:1;overflow-y:auto;padding:8px 10px;}
.fi-row{display:grid;grid-template-columns:34px 1fr 90px 130px;align-items:center;gap:10px;
  padding:8px 10px;border-radius:10px;cursor:pointer;font-size:13px;
  transition:background .12s;animation:tileIn .25s var(--ease) backwards;animation-delay:var(--d,0ms);}
.fi-row:hover{background:var(--hover);}
.fi-row.sel{background:rgba(224,145,47,.18);}
.fi-ic{font-size:20px;text-align:center;}
.fi-name{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.fi-size,.fi-date{font-size:11.5px;color:var(--text-dim);text-align:right;font-variant-numeric:tabular-nums;}
.fi-status{flex:0 0 auto;padding:7px 14px;border-top:1px solid var(--line);
  font-size:11.5px;color:var(--text-dim);}
.fi-empty{color:var(--text-dim);text-align:center;padding:40px 0;font-size:13px;}

/* ================= 记事本 ================= */
.app-notepad{display:flex;flex-direction:column;height:100%;}
.np-bar{display:flex;gap:6px;align-items:center;padding:10px 12px;border-bottom:1px solid var(--line);flex:0 0 auto;}
.np-path{flex:1;min-width:0;font-size:12px;color:var(--text-dim);
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.np-ta{flex:1;resize:none;border:none;outline:none;background:transparent;color:var(--text);
  padding:14px 16px;font-size:14px;line-height:1.75;font-family:ui-monospace,Consolas,"Courier New",monospace;}
.np-status{padding:6px 14px;border-top:1px solid var(--line);font-size:11.5px;color:var(--text-dim);text-align:right;}

/* ================= 计算器 ================= */
.app-calc{display:flex;flex-direction:column;height:100%;padding:14px;gap:12px;}
.ca-screen{background:var(--input-bg);border:1px solid var(--line);border-radius:14px;
  padding:14px 16px;text-align:right;overflow:hidden;}
.ca-expr{font-size:12px;color:var(--text-dim);min-height:16px;white-space:nowrap;
  overflow:hidden;text-overflow:ellipsis;}
.ca-main{font-size:32px;font-weight:700;font-variant-numeric:tabular-nums;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:4px;}
.ca-grid{flex:1;display:grid;grid-template-columns:repeat(4,1fr);gap:8px;}
.ca-key{border:1px solid var(--line);background:var(--hover);color:var(--text);
  border-radius:12px;font-size:17px;cursor:pointer;
  transition:filter .12s,transform .12s var(--ease),background .15s;}
.ca-key:hover{filter:brightness(1.15);}
.ca-key:active{transform:scale(.93);}
.ca-key.op{color:var(--accent);font-weight:700;}
.ca-key.eq{background:linear-gradient(135deg,var(--accent),var(--accent-2));color:#fff;border:none;
  box-shadow:0 6px 16px rgba(224,145,47,.3);}
.ca-key.span2{grid-column:span 2;}
.ca-key.danger{color:#ff7a7f;}

/* ================= 终端 ================= */
.app-term{height:100%;background:#0d1117;color:#c9d4e3;display:flex;flex-direction:column;
  font-family:ui-monospace,Consolas,"Courier New",monospace;font-size:13px;}
[data-theme="light"] .app-term{background:#101620;}
.te-out{flex:1;overflow-y:auto;padding:12px 14px 4px;line-height:1.65;}
.te-line{white-space:pre-wrap;word-break:break-all;animation:teIn .18s ease;}
@keyframes teIn{from{opacity:0;transform:translateY(4px)}}
.te-prompt-txt{color:#7ee787;}
.te-cmd{color:#e3b269;}
.te-err{color:#ff7a7f;}
.te-dim{color:#7d8aa0;}
.te-accent{color:#8fc7a6;}
.te-in-row{display:flex;align-items:center;gap:8px;padding:8px 14px 12px;flex:0 0 auto;}
.te-prompt{color:#7ee787;white-space:nowrap;}
.te-input{flex:1;background:transparent;border:none;outline:none;color:#e6edf3;
  font:inherit;caret-color:#7ee787;}

/* ================= 设置 ================= */
.app-settings{display:flex;height:100%;}
.se-side{width:170px;flex:0 0 170px;border-right:1px solid var(--line);padding:14px 10px;
  display:flex;flex-direction:column;gap:4px;}
.se-nav{display:flex;align-items:center;gap:10px;padding:10px 12px;border:none;border-radius:10px;
  background:transparent;color:var(--text-dim);font-size:13px;cursor:pointer;text-align:left;
  transition:background var(--t-fast),color var(--t-fast);}
.se-nav:hover{background:var(--hover);color:var(--text);}
.se-nav.on{background:var(--hover);color:var(--text);font-weight:600;
  box-shadow:inset 3px 0 0 var(--accent);}
.se-main{flex:1;overflow-y:auto;padding:20px 24px;}
.se-title{font-size:17px;font-weight:800;margin-bottom:16px;}
.se-sec{margin-bottom:22px;}
.se-label{font-size:12px;color:var(--text-dim);margin-bottom:10px;}
.se-row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;}
.seg{display:flex;background:var(--input-bg);border:1px solid var(--line);border-radius:11px;padding:3px;gap:3px;}
.seg button{border:none;background:transparent;color:var(--text-dim);font-size:12px;
  padding:7px 18px;border-radius:8px;cursor:pointer;transition:all .2s var(--ease);}
.seg button.on{background:var(--accent);color:#fff;box-shadow:0 3px 10px rgba(224,145,47,.35);}
.swatch{width:34px;height:34px;border-radius:50%;border:none;cursor:pointer;position:relative;
  transition:transform .2s var(--ease),box-shadow .2s;}
.swatch:hover{transform:scale(1.12);}
.swatch.on{box-shadow:0 0 0 3px var(--win-bg),0 0 0 5.5px var(--accent);transform:scale(1.08);}
.wall-th{width:104px;height:62px;border-radius:11px;border:2px solid var(--line);cursor:pointer;
  background-size:cover;transition:transform .22s var(--ease),border-color .2s;}
.wall-th:hover{transform:scale(1.05);}
.wall-th.on{border-color:var(--accent);box-shadow:0 0 0 3px rgba(224,145,47,.3);}
.se-about{font-size:13px;line-height:2;color:var(--text-dim);}
.se-about b{color:var(--text);}
.se-badge{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:9px;
  background:var(--hover);border:1px solid var(--line);font-size:12px;color:var(--text);margin:0 6px 6px 0;}

/* ================= 任务管理器 ================= */
.app-taskmgr{display:flex;flex-direction:column;height:100%;}
.tm-graphs{display:flex;gap:12px;padding:14px 16px 6px;flex:0 0 auto;}
.tm-gcard{flex:1;background:var(--input-bg);border:1px solid var(--line);border-radius:13px;padding:10px 12px;}
.tm-glabel{font-size:11.5px;color:var(--text-dim);display:flex;justify-content:space-between;margin-bottom:6px;}
.tm-glabel b{color:var(--text);font-size:13px;}
.tm-gcard canvas{width:100%;height:64px;display:block;}
.tm-table-wrap{flex:1;overflow-y:auto;padding:10px 16px 16px;}
.tm-table{width:100%;border-collapse:collapse;font-size:12.5px;}
.tm-table th{text-align:left;color:var(--text-dim);font-weight:600;padding:8px 10px;
  border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--win-bg);}
.tm-table td{padding:9px 10px;border-bottom:1px solid var(--line);}
.tm-table tr{animation:tileIn .25s var(--ease) backwards;}
.tm-row:hover td{background:var(--hover);}
.tm-kill{border:1px solid rgba(229,72,77,.4);background:transparent;color:#ff7a7f;font-size:11.5px;
  padding:4px 12px;border-radius:8px;cursor:pointer;transition:all .15s;}
.tm-kill:hover{background:rgba(229,72,77,.16);}
.tm-sys{color:var(--text-dim);}

/* ================= 时钟与日历 ================= */
.app-clock{display:flex;flex-direction:column;height:100%;}
.cl-tabs{display:flex;gap:6px;padding:12px 16px 0;flex:0 0 auto;}
.cl-tabs button{border:none;background:transparent;color:var(--text-dim);font-size:13px;
  padding:8px 18px;border-radius:10px;cursor:pointer;transition:all .2s var(--ease);}
.cl-tabs button:hover{color:var(--text);background:var(--hover);}
.cl-tabs button.on{background:var(--accent);color:#fff;box-shadow:0 4px 12px rgba(224,145,47,.3);}
.cl-body{flex:1;overflow-y:auto;padding:16px;}
.cl-clockwrap{display:flex;flex-direction:column;align-items:center;gap:10px;padding:12px 0;}
.cl-digital{font-size:30px;font-weight:800;font-variant-numeric:tabular-nums;letter-spacing:1px;}
.cl-date{font-size:13px;color:var(--text-dim);}
.cal-month{font-size:15px;font-weight:700;text-align:center;margin-bottom:10px;}
.st-display{font-size:42px;font-weight:800;font-variant-numeric:tabular-nums;text-align:center;
  padding:26px 0 10px;letter-spacing:2px;}
.st-btns{display:flex;justify-content:center;gap:10px;padding:10px 0 20px;}
.st-btns .fbtn{min-width:76px;height:36px;font-size:13px;}
.cl-laps{max-width:280px;margin:0 auto;}
.cl-lap{display:flex;justify-content:space-between;font-size:12.5px;color:var(--text-dim);
  padding:7px 12px;border-bottom:1px solid var(--line);animation:tileIn .25s var(--ease);}

/* ================= 画板 ================= */
.app-paint{display:flex;flex-direction:column;height:100%;}
.pa-tools{display:flex;align-items:center;gap:10px;padding:10px 14px;border-bottom:1px solid var(--line);
  flex:0 0 auto;flex-wrap:wrap;}
.pa-colors{display:flex;gap:5px;flex-wrap:wrap;}
.pa-c{width:24px;height:24px;border-radius:50%;border:2px solid transparent;cursor:pointer;
  transition:transform .18s var(--ease),border-color .18s;}
.pa-c:hover{transform:scale(1.15);}
.pa-c.on{border-color:var(--text);transform:scale(1.12);}
.pa-size{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--text-dim);}
.pa-size input{accent-color:var(--accent);width:110px;}
.pa-wrap{flex:1;min-height:0;padding:12px 14px 14px;display:flex;}
.pa-wrap canvas{flex:1;border-radius:13px;border:1px solid var(--line);cursor:crosshair;
  background:#fff;touch-action:none;box-shadow:0 8px 24px rgba(0,0,0,.18);}

/* ================= 相册 ================= */
.app-photos{height:100%;display:flex;flex-direction:column;position:relative;}
.ph-grid{flex:1;overflow-y:auto;display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));
  gap:10px;padding:14px 16px;align-content:start;}
.ph-item{border:none;padding:0;background:var(--hover);border-radius:13px;overflow:hidden;
  cursor:pointer;aspect-ratio:4/3;position:relative;
  transition:transform .25s var(--ease),box-shadow .25s var(--ease);
  animation:tileIn .35s var(--ease) backwards;animation-delay:var(--d,0ms);}
.ph-item:hover{transform:translateY(-3px) scale(1.02);box-shadow:0 14px 30px rgba(0,0,0,.3);}
.ph-item img{width:100%;height:100%;object-fit:cover;display:block;}
.ph-view{position:absolute;inset:0;background:rgba(8,10,15,.9);backdrop-filter:blur(8px);
  z-index:30;display:none;flex-direction:column;align-items:center;justify-content:center;gap:14px;}
.ph-view.show{display:flex;animation:fadeIn .22s ease;}
.ph-view img{max-width:86%;max-height:72%;border-radius:13px;box-shadow:0 24px 70px rgba(0,0,0,.6);
  animation:dlgPop .3s var(--ease);}
.ph-cap{color:#cdd5e3;font-size:13px;}
.ph-nav{position:absolute;top:50%;transform:translateY(-50%);width:42px;height:42px;border:none;
  border-radius:50%;background:rgba(255,255,255,.12);color:#fff;font-size:18px;cursor:pointer;
  display:grid;place-items:center;transition:background .2s,transform .2s var(--ease);}
.ph-nav:hover{background:rgba(255,255,255,.25);transform:translateY(-50%) scale(1.08);}
.ph-prev{left:16px;} .ph-next{right:16px;}
.ph-close{position:absolute;top:14px;right:14px;width:36px;height:36px;border:none;border-radius:50%;
  background:rgba(255,255,255,.12);color:#fff;font-size:16px;cursor:pointer;transition:background .2s;}
.ph-close:hover{background:rgba(229,72,77,.8);}

/* ================= 音乐播放器 ================= */
.app-music{display:flex;flex-direction:column;height:100%;padding:16px 18px;gap:12px;}
.mu-info{text-align:center;}
.mu-name{font-size:19px;font-weight:800;}
.mu-artist{font-size:12px;color:var(--text-dim);margin-top:4px;}
.mu-vis{width:100%;height:110px;display:block;}
.mu-ctrl{display:flex;align-items:center;justify-content:center;gap:14px;}
.mu-ctrl button{border:none;background:var(--hover);color:var(--text);cursor:pointer;
  border-radius:50%;display:grid;place-items:center;
  transition:transform .2s var(--ease),background .2s,box-shadow .2s;}
.mu-ctrl button:hover{background:var(--hover);transform:scale(1.08);}
.mu-ctrl button:active{transform:scale(.92);}
.mu-side{width:40px;height:40px;font-size:15px;}
.mu-play{width:56px;height:56px;font-size:22px;background:linear-gradient(135deg,var(--accent),var(--accent-2)) !important;
  color:#fff;box-shadow:0 8px 22px rgba(224,145,47,.4);}
.mu-list{flex:1;overflow-y:auto;min-height:0;}
.mu-track{display:flex;align-items:center;gap:10px;width:100%;padding:10px 12px;border:none;
  background:transparent;color:var(--text);border-radius:11px;cursor:pointer;font-size:13px;
  text-align:left;transition:background .15s;}
.mu-track:hover{background:var(--hover);}
.mu-track.on{background:rgba(224,145,47,.16);}
.mu-track .mu-idx{color:var(--text-dim);font-size:12px;width:18px;}
.mu-vol{display:flex;align-items:center;gap:10px;font-size:12px;color:var(--text-dim);}
.mu-vol input{flex:1;accent-color:var(--accent);}

/* ================= 天气 ================= */
.app-weather{height:100%;display:flex;flex-direction:column;}
.we-cities{display:flex;gap:6px;padding:12px 16px 0;flex-wrap:wrap;flex:0 0 auto;}
.we-chip{border:1px solid var(--line);background:transparent;color:var(--text-dim);font-size:12px;
  padding:6px 14px;border-radius:14px;cursor:pointer;transition:all .2s var(--ease);}
.we-chip:hover{color:var(--text);}
.we-chip.on{background:var(--accent);border-color:var(--accent);color:#fff;}
.we-body{flex:1;overflow-y:auto;padding:14px 18px 18px;}
.we-now{display:flex;align-items:center;gap:18px;padding:8px 4px 14px;}
.we-icon{font-size:52px;filter:drop-shadow(0 6px 14px rgba(0,0,0,.3));}
.we-temp{font-size:44px;font-weight:800;font-variant-numeric:tabular-nums;line-height:1;}
.we-temp small{font-size:18px;font-weight:600;}
.we-desc{font-size:14px;color:var(--text-dim);margin-top:6px;}
.we-extra{display:flex;gap:14px;margin-left:auto;font-size:12px;color:var(--text-dim);flex-wrap:wrap;}
.we-extra b{display:block;color:var(--text);font-size:14px;margin-top:3px;}
.we-hlabel{font-size:12px;color:var(--text-dim);margin:8px 0 6px;}
.we-hourly{width:100%;height:120px;display:block;background:var(--input-bg);
  border:1px solid var(--line);border-radius:13px;}
.we-week{display:grid;grid-template-columns:repeat(7,1fr);gap:8px;margin-top:12px;}
.we-day{background:var(--input-bg);border:1px solid var(--line);border-radius:13px;
  padding:10px 4px;text-align:center;transition:transform .2s var(--ease);}
.we-day:hover{transform:translateY(-3px);}
.we-day .wd-name{font-size:11.5px;color:var(--text-dim);}
.we-day .wd-icon{font-size:20px;margin:6px 0;}
.we-day .wd-hi{font-size:13px;font-weight:700;}
.we-day .wd-lo{font-size:11.5px;color:var(--text-dim);}

/* ================= 模拟浏览器 ================= */
.app-browser{display:flex;flex-direction:column;height:100%;}
.br-bar{display:flex;gap:6px;align-items:center;padding:10px 12px;border-bottom:1px solid var(--line);flex:0 0 auto;}
.br-btn{width:30px;height:30px;border:none;border-radius:9px;background:transparent;
  color:var(--text-dim);cursor:pointer;font-size:14px;transition:background .15s,color .15s;}
.br-btn:hover{background:var(--hover);color:var(--text);}
.br-addr{flex:1;height:32px;border-radius:16px;border:1px solid var(--line);background:var(--input-bg);
  color:var(--text);padding:0 16px;font-size:12.5px;outline:none;transition:border-color .2s,box-shadow .2s;}
.br-addr:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(224,145,47,.2);}
.br-view{flex:1;overflow-y:auto;background:var(--win-bg);}
.br-page{max-width:680px;margin:0 auto;padding:26px 24px 40px;animation:fadeIn .25s ease;}
.bp-hero{text-align:center;padding:36px 0 22px;}
.bp-logo{font-size:34px;font-weight:900;
  background:linear-gradient(135deg,var(--accent),var(--accent-2));
  -webkit-background-clip:text;background-clip:text;color:transparent;}
.bp-search{display:flex;gap:8px;max-width:420px;margin:20px auto 0;}
.bp-search input{flex:1;height:40px;border-radius:20px;border:1px solid var(--line);
  background:var(--input-bg);color:var(--text);padding:0 18px;font-size:13px;outline:none;}
.bp-search input:focus{border-color:var(--accent);}
.bp-search button{height:40px;padding:0 20px;border:none;border-radius:20px;
  background:var(--accent);color:#fff;font-size:13px;cursor:pointer;transition:filter .15s;}
.bp-search button:hover{filter:brightness(1.1);}
.bp-quick{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;max-width:480px;margin:26px auto 0;}
.bp-q{display:flex;flex-direction:column;align-items:center;gap:8px;padding:14px 6px;
  background:var(--hover);border:1px solid var(--line);border-radius:13px;cursor:pointer;
  font-size:12px;color:var(--text);transition:transform .2s var(--ease),border-color .2s;}
.bp-q:hover{transform:translateY(-3px);border-color:var(--accent);}
.bp-q span{font-size:22px;}
.bp-card{background:var(--hover);border:1px solid var(--line);border-radius:14px;
  padding:16px 18px;margin-bottom:12px;transition:transform .2s var(--ease);}
.bp-card:hover{transform:translateY(-2px);}
.bp-card h4{font-size:14.5px;margin-bottom:6px;}
.bp-card p{font-size:12.5px;color:var(--text-dim);line-height:1.7;}
.bp-link{color:var(--accent);cursor:pointer;text-decoration:none;}
.bp-link:hover{text-decoration:underline;}
.bp-wall-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;}
.bp-wall{height:80px;border-radius:11px;border:2px solid var(--line);cursor:pointer;
  transition:transform .2s var(--ease),border-color .2s;}
.bp-wall:hover{transform:scale(1.04);border-color:var(--accent);}

/* ================= 扫雷 ================= */
.app-mine{display:flex;flex-direction:column;align-items:center;height:100%;padding:14px;gap:12px;overflow:auto;}
.mi-bar{display:flex;align-items:center;gap:16px;background:var(--input-bg);
  border:1px solid var(--line);border-radius:13px;padding:8px 18px;}
.mi-num{font-size:17px;font-weight:800;font-variant-numeric:tabular-nums;min-width:44px;text-align:center;}
.mi-face{width:40px;height:40px;border:none;border-radius:50%;background:var(--hover);
  font-size:19px;cursor:pointer;transition:transform .2s var(--ease);}
.mi-face:hover{transform:scale(1.1) rotate(-8deg);}
.mi-grid{display:grid;grid-template-columns:repeat(9,32px);gap:3px;padding:10px;
  background:var(--input-bg);border:1px solid var(--line);border-radius:13px;}
.mi-cell{width:32px;height:32px;border:none;border-radius:7px;cursor:pointer;font-size:14px;font-weight:800;
  background:var(--hover);display:grid;place-items:center;
  transition:transform .12s var(--ease),background .15s;}
.mi-cell:hover{filter:brightness(1.2);}
.mi-cell:active{transform:scale(.9);}
.mi-cell.revealed{background:var(--input-bg);border:1px solid var(--line);cursor:default;transform:none;}
.mi-cell.flag{background:rgba(246,140,60,.25);}
.mi-cell.boom{background:rgba(229,72,77,.55);}
.mi-cell.n1{color:#5a8a9e}.mi-cell.n2{color:#3fb950}.mi-cell.n3{color:#ff7b72}
.mi-cell.n4{color:#2f8e8b}.mi-cell.n5{color:#ffa657}.mi-cell.n6{color:#39c5cf}
.mi-cell.n7{color:#e8ecf4}.mi-cell.n8{color:#8b949e}

/* ================= 2048 ================= */
.app-2048{display:flex;flex-direction:column;align-items:center;height:100%;padding:14px;gap:12px;overflow:auto;}
.g-head{display:flex;gap:10px;width:100%;max-width:400px;}
.g-box{flex:1;background:var(--input-bg);border:1px solid var(--line);border-radius:12px;
  text-align:center;padding:8px 0;}
.g-box small{display:block;font-size:10.5px;color:var(--text-dim);letter-spacing:1px;}
.g-box b{font-size:18px;font-variant-numeric:tabular-nums;}
.g-grid{position:relative;width:100%;max-width:400px;aspect-ratio:1;
  background:var(--input-bg);border:1px solid var(--line);border-radius:14px;padding:8px;
  display:grid;grid-template-columns:repeat(4,1fr);grid-template-rows:repeat(4,1fr);gap:8px;}
.g-cell{background:rgba(128,140,165,.12);border-radius:10px;}
.g-over{position:absolute;inset:0;border-radius:14px;background:rgba(10,12,18,.72);
  backdrop-filter:blur(4px);display:none;flex-direction:column;align-items:center;justify-content:center;
  gap:14px;z-index:5;animation:fadeIn .3s ease;}
.g-over.show{display:flex;}
.g-over b{font-size:22px;color:#fff;}
.g-pad{display:grid;grid-template-columns:repeat(3,56px);gap:6px;}
.g-pad button{height:42px;border:1px solid var(--line);background:var(--hover);color:var(--text);
  border-radius:10px;font-size:16px;cursor:pointer;transition:all .15s;}
.g-pad button:hover{background:var(--hover);filter:brightness(1.25);}
.g-pad button:active{transform:scale(.9);}
.g-hint{font-size:11.5px;color:var(--text-dim);}
.g2048-sp{visibility:hidden;}

/* ================= 贪吃蛇 ================= */
.app-snake{display:flex;flex-direction:column;align-items:center;height:100%;padding:14px;gap:12px;}
.sn-head{display:flex;gap:14px;align-items:center;font-size:13px;color:var(--text-dim);}
.sn-head b{color:var(--text);font-size:16px;font-variant-numeric:tabular-nums;}
.sn-wrap{position:relative;}
.sn-wrap canvas{border-radius:13px;border:1px solid var(--line);background:#10141d;display:block;}
.sn-over{position:absolute;inset:0;border-radius:13px;background:rgba(10,12,18,.72);
  backdrop-filter:blur(4px);display:none;flex-direction:column;align-items:center;justify-content:center;
  gap:12px;animation:fadeIn .25s ease;}
.sn-over.show{display:flex;}
.sn-over b{font-size:20px;color:#fff;}
.sn-hint{font-size:11.5px;color:var(--text-dim);}

/* ================= 待办清单 ================= */
.app-todo{display:flex;flex-direction:column;height:100%;padding:14px 16px;gap:12px;}
.td-add{display:flex;gap:8px;}
.td-add input{flex:1;height:36px;border-radius:10px;border:1px solid var(--line);
  background:var(--input-bg);color:var(--text);padding:0 14px;font-size:13px;outline:none;
  transition:border-color .2s,box-shadow .2s;}
.td-add input:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(224,145,47,.2);}
.td-add button{height:36px;padding:0 18px;border:none;border-radius:10px;background:var(--accent);
  color:#fff;font-size:13px;font-weight:600;cursor:pointer;transition:filter .15s,transform .15s var(--ease);}
.td-add button:hover{filter:brightness(1.1);}
.td-add button:active{transform:scale(.94);}
.td-filters{display:flex;gap:6px;}
.td-chip{border:1px solid var(--line);background:transparent;color:var(--text-dim);font-size:11.5px;
  padding:4px 13px;border-radius:12px;cursor:pointer;transition:all .2s var(--ease);}
.td-chip.on{background:var(--accent);border-color:var(--accent);color:#fff;}
.td-list{flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:6px;min-height:0;}
.td-item{display:flex;align-items:center;gap:10px;background:var(--hover);
  border:1px solid var(--line);border-radius:11px;padding:10px 12px;
  animation:tileIn .28s var(--ease);transition:opacity .3s,transform .3s var(--ease);}
.td-item.done{opacity:.55;}
.td-item.done .td-text{text-decoration:line-through;}
.td-item.bye{opacity:0;transform:translateX(30px);}
.td-check{width:20px;height:20px;border-radius:50%;border:2px solid var(--text-dim);
  background:transparent;cursor:pointer;flex:0 0 20px;display:grid;place-items:center;
  color:transparent;font-size:11px;transition:all .2s var(--ease);}
.td-check.on{background:var(--accent);border-color:var(--accent);color:#fff;}
.td-text{flex:1;font-size:13px;min-width:0;word-break:break-all;}
.td-del{border:none;background:transparent;color:var(--text-dim);cursor:pointer;font-size:15px;
  width:26px;height:26px;border-radius:7px;transition:all .15s;}
.td-del:hover{background:rgba(229,72,77,.2);color:#ff7a7f;}
.td-foot{display:flex;justify-content:space-between;font-size:11.5px;color:var(--text-dim);}

/* ================= 相机 / 录音机 / 钢琴（真硬件应用） ================= */
.app-cam{display:flex;flex-direction:column;gap:10px;padding:12px;}
.cam-stage{position:relative;flex:1;min-height:0;border-radius:12px;overflow:hidden;background:#0b0d13;border:1px solid var(--line);}
.cam-stage video{width:100%;height:100%;object-fit:cover;display:block;transform:scaleX(-1);transition:filter .25s var(--ease);}
.cam-stage video.no-mirror{transform:none;}
.cam-flash{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none;}
.cam-flash.go{animation:camFlash .5s ease-out;}
@keyframes camFlash{from{opacity:.85}to{opacity:0}}
.cam-count{position:absolute;inset:0;display:grid;place-items:center;font-size:86px;font-weight:200;color:#fff;
  text-shadow:0 4px 24px rgba(0,0,0,.55);pointer-events:none;}
.cam-count span{display:block;animation:camNum .95s var(--ease) both;}
@keyframes camNum{from{opacity:0;transform:scale(1.8)}30%{opacity:1;transform:scale(1)}to{opacity:0;transform:scale(.85)}}
.cam-off{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;
  background:rgba(10,12,18,.74);backdrop-filter:blur(6px);text-align:center;padding:20px;}
.cam-off p{color:var(--text-dim);font-size:13px;}
.cam-off .cam-err{font-size:11.5px;color:#ff9a9e;max-width:320px;word-break:break-all;}
.cam-filters{display:flex;gap:6px;flex-wrap:wrap;}
.cam-f{border:1px solid var(--line);background:var(--hover);color:var(--text-dim);
  padding:4px 12px;border-radius:12px;cursor:pointer;font-size:12px;transition:all .18s var(--ease);}
.cam-f:hover{color:var(--text);transform:translateY(-1px);}
.cam-f.on{background:var(--accent);border-color:var(--accent);color:#fff;}
.cam-actions{display:flex;align-items:center;justify-content:center;gap:14px;padding:2px 0;}
.cam-shutter{width:52px;height:52px;border-radius:50%;border:none;cursor:pointer;
  background:radial-gradient(circle at 32% 30%,#ff9a9e,#e5484d 60%,#b91c3c);
  box-shadow:0 6px 22px rgba(229,72,77,.45),inset 0 0 0 3px rgba(255,255,255,.75);
  transition:transform .18s var(--ease),box-shadow .18s;}
.cam-shutter:hover{transform:scale(1.06);}
.cam-shutter:active{transform:scale(.9);box-shadow:0 3px 12px rgba(229,72,77,.4),inset 0 0 0 3px rgba(255,255,255,.75);}
.cam-shot{position:absolute;right:12px;bottom:12px;width:64px;height:44px;border-radius:8px;border:2px solid rgba(255,255,255,.8);
  background-size:cover;background-position:center;box-shadow:0 4px 14px rgba(0,0,0,.4);animation:tileIn .3s var(--ease);}

.app-rec{display:flex;flex-direction:column;gap:10px;padding:12px;}
.rec-status{display:flex;align-items:center;gap:10px;font-size:12.5px;color:var(--text-dim);min-height:20px;}
.rec-dot{width:10px;height:10px;border-radius:50%;background:#8a919f;flex:0 0 10px;}
.rec-dot.live{background:#e5484d;animation:recPing 1.2s ease-out infinite;}
@keyframes recPing{from{box-shadow:0 0 0 0 rgba(229,72,77,.45)}to{box-shadow:0 0 0 12px rgba(229,72,77,0)}}
.rec-time{font-variant-numeric:tabular-nums;font-weight:600;color:var(--text);}
.rec-wave{flex:1;min-height:110px;border-radius:12px;background:var(--hover);border:1px solid var(--line);
  display:grid;place-items:center;overflow:hidden;position:relative;}
.rec-wave canvas{width:100%;height:100%;display:block;}
.rec-hint{position:absolute;inset:0;display:grid;place-items:center;font-size:12.5px;color:var(--text-dim);text-align:center;padding:0 20px;}
.rec-main{display:flex;align-items:center;justify-content:center;gap:16px;}
.rec-btn{width:52px;height:52px;border-radius:50%;border:none;cursor:pointer;
  background:radial-gradient(circle at 32% 30%,#ff8a8f,#e5484d 60%,#b91c3c);
  box-shadow:0 6px 22px rgba(229,72,77,.4),inset 0 0 0 3px rgba(255,255,255,.7);
  display:grid;place-items:center;transition:transform .18s var(--ease),box-shadow .18s;}
.rec-btn:hover{transform:scale(1.06);}
.rec-btn:active{transform:scale(.9);}
.rec-btn span{width:18px;height:18px;border-radius:5px;background:#fff;transition:border-radius .25s var(--ease),transform .25s var(--ease);}
.rec-btn.stop span{border-radius:50%;transform:scale(.92);}
.rec-list{max-height:150px;overflow-y:auto;display:flex;flex-direction:column;gap:6px;min-height:0;}
.rec-item{display:flex;align-items:center;gap:10px;background:var(--hover);border:1px solid var(--line);
  border-radius:11px;padding:8px 12px;font-size:12.5px;animation:tileIn .28s var(--ease);}
.rec-item.playing{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent) inset;}
.rec-item .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.rec-item .dur{color:var(--text-dim);font-variant-numeric:tabular-nums;}
.rec-play{border:none;background:var(--accent);color:#fff;border-radius:8px;width:26px;height:26px;cursor:pointer;font-size:11px;
  transition:transform .15s var(--ease),filter .15s;}
.rec-play:hover{transform:scale(1.08);filter:brightness(1.1);}
.rec-del{border:none;background:transparent;color:var(--text-dim);cursor:pointer;width:24px;height:24px;border-radius:6px;transition:all .15s;}
.rec-del:hover{background:rgba(229,72,77,.2);color:#ff7a7f;}

.app-piano{display:flex;flex-direction:column;gap:10px;padding:12px;}
.pi-top{display:flex;align-items:center;gap:6px;flex-wrap:wrap;}
.pi-chip{border:1px solid var(--line);background:var(--hover);color:var(--text-dim);
  padding:4px 12px;border-radius:12px;cursor:pointer;font-size:12px;transition:all .18s var(--ease);}
.pi-chip:hover{color:var(--text);transform:translateY(-1px);}
.pi-chip.on{background:var(--accent);border-color:var(--accent);color:#fff;}
.pi-hint{margin-left:auto;font-size:11.5px;color:var(--text-dim);}
.pi-strip{position:relative;flex:1;min-height:170px;display:flex;gap:4px;border-radius:12px;
  background:linear-gradient(180deg,#1a1e28,#12151d);border:1px solid var(--line);padding:10px;}
.pi-w{position:relative;flex:1;border-radius:0 0 8px 8px;cursor:pointer;
  background:linear-gradient(180deg,#fdfdfd,#e6e8ee);
  box-shadow:inset 0 -5px 10px rgba(20,25,40,.12);
  transition:transform .09s ease,background .12s;}
.pi-w.down{background:linear-gradient(180deg,var(--accent),#b06a28);transform:translateY(2px);box-shadow:inset 0 -4px 10px rgba(0,0,0,.3);}
.pi-b{position:absolute;top:10px;width:26px;height:56%;border-radius:0 0 6px 6px;z-index:2;cursor:pointer;
  background:linear-gradient(180deg,#3a3f4d,#171a22);border:1px solid #0b0d13;border-top:none;
  box-shadow:0 4px 10px rgba(0,0,0,.45);transition:transform .09s ease,background .12s;}
.pi-b.down{background:var(--accent);transform:translateY(2px);}
.pi-note{position:absolute;bottom:7px;left:0;right:0;text-align:center;font-size:9.5px;color:#a99d8b;pointer-events:none;}

/* ================= 动画打磨（高雅细节） ================= */
.win{transition:box-shadow var(--t-med) var(--ease),border-color var(--t-med) var(--ease);}
.dicon:hover{background:rgba(255,236,210,.12);transform:translateY(-2px);}
.st-ic{transition:transform .25s var(--ease);}
.st-card:hover .st-ic{transform:scale(1.06) rotate(-2deg);}
.sm-tile:hover .app-ic{transform:scale(1.08) translateY(-1px);}
.sm-tile .app-ic{transition:transform .22s var(--ease);}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms !important;transition-duration:.01ms !important;animation-iteration-count:1 !important;}
}

/* ================= 通讯录 ================= */
.app-contacts{display:flex;height:100%;}
.ct-side{width:230px;flex:0 0 230px;border-right:1px solid var(--line);display:flex;flex-direction:column;}
.ct-tools{padding:10px;display:flex;gap:6px;border-bottom:1px solid var(--line);}
.ct-search{flex:1;min-width:0;height:30px;border-radius:9px;border:1px solid var(--line);background:var(--input-bg);color:var(--text);padding:0 10px;font-size:12.5px;outline:none;}
.ct-search:focus{border-color:var(--accent);}
.ct-list{flex:1;overflow-y:auto;padding:6px;}
.ct-row{display:flex;align-items:center;gap:10px;width:100%;padding:8px 10px;border:none;background:transparent;border-radius:10px;cursor:pointer;text-align:left;color:var(--text);transition:background var(--t-fast);animation:tileIn .25s var(--ease) backwards;animation-delay:var(--d,0ms);}
.ct-row:hover{background:var(--hover);}
.ct-row.sel{background:rgba(224,145,47,.16);}
.ct-ava{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-size:14px;font-weight:700;color:#fff;flex:0 0 34px;}
.ct-nm{font-size:13px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.ct-sub{font-size:11px;color:var(--text-dim);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.ct-star{margin-left:auto;font-size:13px;opacity:.85;}
.ct-main{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;padding:20px;}
.ct-big{width:76px;height:76px;border-radius:50%;display:grid;place-items:center;font-size:30px;font-weight:700;color:#fff;box-shadow:0 10px 26px rgba(12,8,4,.35);}
.ct-field{font-size:13.5px;color:var(--text);}
.ct-field small{color:var(--text-dim);margin-right:8px;font-size:11px;}
.ct-acts{display:flex;gap:8px;margin-top:8px;}
.ct-empty{color:var(--text-dim);font-size:13px;text-align:center;padding:40px 0;}

/* ================= 邮件 ================= */
.app-mail{display:flex;height:100%;}
.ml-side{width:150px;flex:0 0 150px;border-right:1px solid var(--line);padding:12px 8px;display:flex;flex-direction:column;gap:4px;}
.ml-nav{display:flex;align-items:center;gap:8px;padding:9px 11px;border:none;border-radius:9px;background:transparent;color:var(--text-dim);font-size:13px;cursor:pointer;text-align:left;transition:background var(--t-fast),color var(--t-fast);}
.ml-nav:hover{background:var(--hover);color:var(--text);}
.ml-nav.on{background:rgba(224,145,47,.16);color:var(--text);font-weight:600;}
.ml-nav .n{margin-left:auto;font-size:10.5px;background:var(--accent);color:#fff;border-radius:9px;padding:1px 6px;}
.ml-compose{margin-top:auto;}
.ml-list{width:250px;flex:0 0 250px;border-right:1px solid var(--line);overflow-y:auto;padding:6px;}
.ml-item{padding:10px 12px;border-radius:10px;cursor:pointer;transition:background var(--t-fast);animation:tileIn .25s var(--ease) backwards;animation-delay:var(--d,0ms);}
.ml-item:hover{background:var(--hover);}
.ml-item.sel{background:rgba(224,145,47,.16);}
.ml-top{display:flex;align-items:center;gap:6px;}
.ml-from{font-size:13px;font-weight:600;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.ml-item.unread .ml-from{color:var(--accent);}
.ml-dot{width:7px;height:7px;border-radius:50%;background:var(--accent);flex:0 0 7px;}
.ml-sub{font-size:12px;color:var(--text);margin-top:3px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.ml-prev{font-size:11px;color:var(--text-dim);margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.ml-read{flex:1;min-width:0;overflow-y:auto;padding:18px 20px;}
.ml-rsubj{font-size:17px;font-weight:700;margin-bottom:6px;}
.ml-rmeta{font-size:12px;color:var(--text-dim);padding-bottom:12px;border-bottom:1px solid var(--line);margin-bottom:12px;}
.ml-rbody{font-size:13.5px;line-height:1.8;white-space:pre-wrap;color:var(--text);}
.ml-hint{flex:1;display:grid;place-items:center;color:var(--text-dim);font-size:13px;}

/* ================= 便签 ================= */
.app-notes{height:100%;display:flex;flex-direction:column;}
.nt-bar{padding:10px 12px;border-bottom:1px solid var(--line);display:flex;gap:6px;align-items:center;flex:0 0 auto;}
.nt-grid{flex:1;overflow-y:auto;padding:14px;display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px;align-content:start;}
.nt-card{position:relative;border-radius:12px;padding:12px 12px 26px;font-size:12.5px;line-height:1.6;color:#3d3222;
  box-shadow:0 6px 16px rgba(12,8,4,.18);transform:rotate(var(--r,0deg));transition:transform .2s var(--ease),box-shadow .2s var(--ease);
  animation:tileIn .3s var(--ease) backwards;animation-delay:var(--d,0ms);}
.nt-card:hover{transform:rotate(0deg) translateY(-3px) scale(1.02);box-shadow:0 12px 26px rgba(12,8,4,.26);z-index:2;}
.nt-ta{width:100%;min-height:76px;background:transparent;border:none;outline:none;resize:none;font:inherit;color:inherit;}
.nt-del{position:absolute;top:6px;right:6px;width:20px;height:20px;border:none;border-radius:50%;background:rgba(0,0,0,.14);color:#3d3222;cursor:pointer;font-size:11px;line-height:1;display:grid;place-items:center;opacity:0;transition:opacity .15s;}
.nt-card:hover .nt-del{opacity:1;}
.nt-date{position:absolute;bottom:7px;left:12px;font-size:10px;color:rgba(0,0,0,.38);}
.nt-empty{grid-column:1/-1;text-align:center;color:var(--text-dim);font-size:13px;padding:40px 0;}

/* ================= 数独 ================= */
.app-sudoku{height:100%;display:flex;flex-direction:column;align-items:center;gap:10px;padding:12px;}
.su-top{display:flex;gap:8px;align-items:center;width:100%;max-width:400px;justify-content:space-between;}
.su-mistakes{font-size:12px;color:var(--text-dim);}
.su-board{display:grid;grid-template-columns:repeat(9,1fr);gap:2px;background:var(--line);border:2px solid var(--text-dim);border-radius:10px;padding:4px;width:100%;max-width:400px;aspect-ratio:1;user-select:none;}
.su-cell{position:relative;background:var(--win-bg);border-radius:3px;display:grid;place-items:center;font-size:17px;font-weight:600;color:var(--text);cursor:pointer;font-variant-numeric:tabular-nums;transition:background .12s;}
.su-cell.given{color:var(--text);}
.su-cell.user{color:var(--accent);}
.su-cell.sel{background:rgba(224,145,47,.26);}
.su-cell.peer{background:var(--hover);}
.su-cell.dup{color:#e5484d;}
.su-cell.r3{border-right:2.5px solid var(--text-dim);}
.su-cell.b3{border-bottom:2.5px solid var(--text-dim);}
.su-pad{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;width:100%;max-width:400px;}
.su-key{height:38px;border:1px solid var(--line);background:var(--hover);color:var(--text);border-radius:10px;font-size:16px;font-weight:600;cursor:pointer;transition:filter .12s,transform .12s var(--ease);}
.su-key:hover{filter:brightness(1.15);}
.su-key:active{transform:scale(.93);}
.su-done{font-size:14px;font-weight:700;color:var(--accent);animation:dlgPop .3s var(--ease);}

/* ================= 白噪音 ================= */
.app-noise{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;padding:20px;}
.nz-scene{font-size:15px;font-weight:700;letter-spacing:1px;display:flex;align-items:center;gap:8px;}
.nz-grid{display:grid;grid-template-columns:repeat(2,minmax(120px,150px));gap:12px;}

<script>
'use strict';
/* ==================================================================
 * WebOS · Aurora 3.0
 * 模块结构：Utils → State → FS → WM/Snap → Taskbar/StartMenu/Desktop
 *          → AppStore逻辑 → 应用注册表(core基础应用 + 市场应用) → init
 * ================================================================== */

/* ================= 工具函数 ================= */
const $  = (s, r) => (r || document).querySelector(s);
const $$ = (s, r) => Array.from((r || document).querySelectorAll(s));
const EASE = 'cubic-bezier(.22,1,.36,1)';
const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const esc = s => String(s).replace(/[&<>"']/g, c =>
  ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const jp = (a, b) => (a === '/' ? '' : a) + '/' + b;   /* 路径拼接 */
const TOUCH = ('ontouchstart' in window);

/* ================= 持久化状态 ================= */
const LS_KEY = 'webos.aurora.state';
const LS_FS  = 'webos.aurora.fs';
const State = {
  data: {
    theme: 'dark', accent: '#e0912f', wall: 0,
    installed: [],            /* 已安装市场应用 id 列表 */
    todo: [], best2048: 0, paintN: 0, musicIdx: 0, musicVol: 70
  },
  load() {
    try { const raw = localStorage.getItem(LS_KEY);
      if (raw) Object.assign(this.data, JSON.parse(raw)); } catch (e) {}
    if (!Array.isArray(this.data.installed)) this.data.installed = [];
    /* 旧版本强调色迁移：不在新色板内则回默认琥珀 */
    if (ACCENTS.indexOf(this.data.accent) === -1) this.data.accent = ACCENTS[0];
  },
  save() {
    try { localStorage.setItem(LS_KEY, JSON.stringify(this.data)); }
    catch (e) { /* 存储满时静默降级 */ }
  },
  isInstalled(id) { return this.data.installed.indexOf(id) !== -1; }
};

/* ================= 虚拟文件系统 VFS ================= */
const FS = {
  root: null,
  seed() {
    this.root = { type: 'dir', children: {
      '文档': { type: 'dir', children: {
        '欢迎.txt': { type: 'file', content:
'欢迎使用 WebOS · Aurora 3.0\n\n这是一个完全运行在浏览器中的桌面系统。\n\n· 无需密码，打开即用\n· 应用市场可安装 18 款应用\n· 所有数据保存在本地浏览器，随时可删\n\n快捷键：\n  双击标题栏 —— 最大化 / 还原\n  拖到屏幕边缘 —— 分屏贴合\n  Esc —— 关闭开始菜单\n' },
        '使用技巧.txt': { type: 'file', content:
'1. 终端里输入 neofetch 查看系统信息\n2. 终端里输入 open 应用名 可以直接启动应用\n3. 在画板里画一张画，保存后到相册里查看\n4. 右键桌面可以快速更换壁纸\n' }
      }},
      '图片': { type: 'dir', children: {} },
      '音乐': { type: 'dir', children: {} },
      '下载': { type: 'dir', children: {} }
    }};
    this.save();
  },
  load() {
    const raw = localStorage.getItem(LS_FS);
    if (raw) { try { this.root = JSON.parse(raw); } catch (e) {} }
    if (!this.root || !this.root.children) { this.seed(); return; }
    this.save();
  },
  save() {
    try { localStorage.setItem(LS_FS, JSON.stringify(this.root)); } catch (e) {}
  },
  norm(path) {
    const out = [];
    String(path || '/').split('/').forEach(p => {
      if (!p || p === '.') return;
      if (p === '..') out.pop(); else out.push(p);
    });
    return out;
  },
  node(path) {
    let n = this.root;
    const parts = this.norm(path);
    for (let i = 0; i < parts.length; i++) {
      if (!n || n.type !== 'dir' || !n.children[parts[i]]) return null;
      n = n.children[parts[i]];
    }
    return n;
  },
  parent(path) {
    const parts = this.norm(path);
    const name = parts.pop();
    return ['/' + parts.join('/'), name];
  },
  list(path) {
    const n = this.node(path);
    if (!n || n.type !== 'dir') return null;
    return Object.keys(n.children).map(name => {
      const c = n.children[name];
      return { name, type: c.type, content: c.type === 'file' ? c.content : '' };
    });
  },
  mkdir(path) {
    const p = this.parent(path), d = this.node(p[0]), name = p[1];
    if (!d || d.type !== 'dir' || !name || d.children[name]) return false;
    d.children[name] = { type: 'dir', children: {} };
    this.save(); return true;
  },
  writeFile(path, content) {
    const p = this.parent(path), d = this.node(p[0]), name = p[1];
    if (!d || d.type !== 'dir' || !name) return false;
    if (d.children[name] && d.children[name].type === 'dir') return false;
    d.children[name] = { type: 'file', content: String(content) };
    this.save(); return true;
  },
  readFile(path) {
    const n = this.node(path);
    return (n && n.type === 'file') ? n.content : null;
  },
  remove(path) {
    if (!this.norm(path).length) return false;   /* 禁止删除根目录 */
    const p = this.parent(path), d = this.node(p[0]);
    if (!d || !d.children[p[1]]) return false;
    delete d.children[p[1]];
    this.save(); return true;
  }
};

/* ================= 主题 / 壁纸 ================= */
const WALLS = [
  'linear-gradient(160deg,#1a1410,#2b2118,#3d2b1e)',
  'linear-gradient(135deg,#2d1e14,#6e4732,#c98a5e)',
  'linear-gradient(160deg,#16211b,#2c4232,#4a6b4f)',
  'linear-gradient(135deg,#f7dcbc,#eeb08c,#e58e6a)',
  'linear-gradient(160deg,#101314,#1f2a2c,#33555a)',
  'linear-gradient(135deg,#ece2cf,#d4bd97,#b3956c)'
];
const ACCENTS = ['#e0912f', '#c65a28', '#5f8a4e', '#2f8e8b', '#c0392b', '#8a6d3b'];

function applyTheme() {
  document.documentElement.dataset.theme = State.data.theme;
}
function applyAccent() {
  document.documentElement.style.setProperty('--accent', State.data.accent);
}
function applyWall() {
  document.documentElement.style.setProperty('--wall', WALLS[State.data.wall % WALLS.length]);
}

/* ================= 全局 Toast ================= */
function toast(msg, icon) {
  const t = document.createElement('div');
  t.className = 'toast';
  t.innerHTML = '<span class="t-ic">' + (icon || '✨') + '</span><span>' + esc(msg) + '</span>';
  $('#toasts').appendChild(t);
  requestAnimationFrame(() => requestAnimationFrame(() => t.classList.add('in')));
  setTimeout(() => {
    t.classList.remove('in');
    setTimeout(() => t.remove(), 450);
  }, 2400);
}

/* ================= 窗口管理器 ================= */
const WM = {
  wins: new Map(),          /* id -> win */
  z: 100,
  activeId: null,
  layer: null,

  init() { this.layer = $('#win-layer'); },

  place(win) {
    const r = win.rect;
    win.el.style.transform = 'translate3d(' + r.x + 'px,' + r.y + 'px,0)';
    win.el.style.width = r.w + 'px';
    win.el.style.height = r.h + 'px';
  },

  open(appId, params) {
    const def = APPS[appId];
    if (!def) { toast('应用不存在：' + appId, '⚠️'); return null; }
    /* 单实例：已打开则聚焦并传参 */
    let found = null;
    this.wins.forEach(w => { if (w.appId === appId) found = w; });
    if (found) {
      if (found.minimized) this.restore(found.id); else this.focus(found.id);
      if (params && typeof found.onParams === 'function') found.onParams(params);
      return found;
    }
    return this.create(def, params);
  },

  create(def, params) {
    const appId = def.id;
    const id = uid();
    const el = document.createElement('div');
    el.className = 'win';
    const maxW = def.w || 720, maxH = def.h || 500;
    const small = innerWidth < 720;
    let W, H, x, y;
    if (small) {
      W = innerWidth; H = innerHeight - 56;
      x = 0; y = 0;
    } else {
      W = Math.min(maxW, innerWidth - 60);
      H = Math.min(maxH, innerHeight - 130);
      const off = (this.wins.size % 5) * 26;
      x = clamp(Math.round((innerWidth - W) / 2) + off - 50, 10, innerWidth - W - 10);
      y = clamp(Math.round((innerHeight - H - 56) / 2) + off - 40, 10, innerHeight - H - 66);
    }
    const win = {
      id, appId, el, def, minimized: false, maximized: small,
      rect: { x, y, w: W, h: H },
      prevRect: null, cleanup: [], onParams: null, onResize: null, minAnim: null
    };
    this.wins.set(id, win);

    el.innerHTML =
      '<div class="tb">' +
        '<div class="tb-ic" style="background:linear-gradient(135deg,' + def.g[0] + ',' + def.g[1] + ')">' + def.icon + '</div>' +
        '<div class="tb-title">' + esc(def.name) + '</div>' +
        '<div class="tb-btns">' +
          '<button class="wbtn min" title="最小化"></button>' +
          '<button class="wbtn max" title="最大化 / 还原"></button>' +
          '<button class="wbtn cls" title="关闭"></button>' +
        '</div>' +
      '</div>' +
      '<div class="wbody"></div>' +
      ['n','s','e','w','ne','nw','se','sw'].map(d =>
        '<div class="rz rz-' + d + '" data-rz="' + d + '"></div>').join('');

    this.layer.appendChild(el);
    win.body = el.querySelector('.wbody');
    this.place(win);
    if (small) el.classList.add('maxed');

    /* 打开动画：scale 0.92→1 + fade in（仅 transform/opacity，GPU 加速） */
    el.animate([
      { transform: 'translate3d(' + x + 'px,' + y + 'px,0) scale(.92)', opacity: 0 },
      { transform: 'translate3d(' + x + 'px,' + y + 'px,0) scale(1)', opacity: 1 }
    ], { duration: 280, easing: EASE });

    /* 事件绑定 */
    el.addEventListener('pointerdown', () => this.focus(id), true);
    el.querySelector('.wbtn.min').addEventListener('click', e => { e.stopPropagation(); this.minimize(id); });
    el.querySelector('.wbtn.max').addEventListener('click', e => { e.stopPropagation(); this.toggleMax(id); });
    el.querySelector('.wbtn.cls').addEventListener('click', e => { e.stopPropagation(); this.close(id); });
    const tbar = el.querySelector('.tb');
    tbar.addEventListener('dblclick', e => {
      if (e.target.closest('.wbtn')) return;
      this.toggleMax(id);
    });
    tbar.addEventListener('pointerdown', e => {
      if (e.button !== 0 || e.target.closest('.wbtn')) return;
      if (win.maximized) return;
      this.startDrag(win, e);
    });
    $$('.rz', el).forEach(hd =>
      hd.addEventListener('pointerdown', e => this.startResize(win, e, hd.dataset.rz)));

    Taskbar.addWin(win);
    def.mount(el.querySelector('.wbody'), win, params || null);
    this.focus(id);
    return win;
  },

  focus(id) {
    const win = this.wins.get(id);
    if (!win) return;
    this.activeId = id;
    win.el.style.zIndex = ++this.z;
    this.wins.forEach(w =>
      w.el.classList.toggle('focused', w.id === id && !w.minimized));
    Taskbar.sync();
  },

  focusTop() {
    let top = null, topZ = -1;
    this.wins.forEach(w => {
      if (!w.minimized) {
        const zv = parseInt(w.el.style.zIndex, 10) || 0;
        if (zv > topZ) { topZ = zv; top = w; }
      }
    });
    if (top) this.focus(top.id);
    else {
      this.activeId = null;
      this.wins.forEach(w => w.el.classList.remove('focused'));
      Taskbar.sync();
    }
  },

  minimize(id) {
    const win = this.wins.get(id);
    if (!win || win.minimized) return;
    win.minimized = true;
    const el = win.el, r = win.rect;
    const btn = Taskbar.btnOf(id);
    const bx = btn ? btn.getBoundingClientRect().left + 20 : innerWidth / 2;
    /* 最小化：向任务栏收拢 + 渐隐（transform + opacity） */
    win.minAnim = el.animate([
      { transform: 'translate3d(' + r.x + 'px,' + r.y + 'px,0) scale(1)', opacity: 1 },
      { transform: 'translate3d(' + (bx - r.w / 2) + 'px,' + (innerHeight + 60) + 'px,0) scale(.35)', opacity: 0 }
    ], { duration: 300, easing: EASE, fill: 'forwards' });
    win.minAnim.onfinish = () => { el.style.display = 'none'; };
    if (this.activeId === id) { this.activeId = null; this.focusTop(); }
    Taskbar.sync();
  },

  restore(id) {
    const win = this.wins.get(id);
    if (!win) return;
    if (!win.minimized) { this.focus(id); return; }
    win.minimized = false;
    const el = win.el;
    el.style.display = '';
    if (win.minAnim) { try { win.minAnim.cancel(); } catch (e) {} win.minAnim = null; }
    const r = win.rect;
    const btn = Taskbar.btnOf(id);
    const bx = btn ? btn.getBoundingClientRect().left + 20 : innerWidth / 2;
    /* 恢复动画：从任务栏弹回 */
    el.animate([
      { transform: 'translate3d(' + (bx - r.w / 2) + 'px,' + (innerHeight + 60) + 'px,0) scale(.35)', opacity: 0 },
      { transform: 'translate3d(' + r.x + 'px,' + r.y + 'px,0) scale(1)', opacity: 1 }
    ], { duration: 320, easing: EASE });
    this.focus(id);
  },

  toggleMax(id) {
    const win = this.wins.get(id);
    if (!win) return;
    const el = win.el;
    el.classList.add('anim');
    if (!win.maximized) {
      win.prevRect = { x: win.rect.x, y: win.rect.y, w: win.rect.w, h: win.rect.h };
      win.rect = { x: 0, y: 0, w: innerWidth, h: innerHeight - 56 };
      win.maximized = true;
      el.classList.add('maxed');
    } else {
      const p = win.prevRect || { x: 60, y: 50, w: Math.min(760, innerWidth - 80), h: Math.min(520, innerHeight - 150) };
      win.rect = { x: p.x, y: p.y, w: p.w, h: p.h };
      win.maximized = false;
      el.classList.remove('maxed');
    }
    this.place(win);
    clearTimeout(win._at);
    win._at = setTimeout(() => {
      el.classList.remove('anim');
      if (typeof win.onResize === 'function') win.onResize();
    }, 300);
  },

  close(id) {
    const win = this.wins.get(id);
    if (!win || win.closing) return;
    win.closing = true;
    win.cleanup.forEach(fn => { try { fn(); } catch (e) {} });
    const el = win.el;
    this.wins.delete(id);
    Taskbar.removeWin(id);
    if (this.activeId === id) { this.activeId = null; this.focusTop(); }
    if (win.minimized || el.style.display === 'none') { el.remove(); return; }
    const r = win.rect;
    el.style.pointerEvents = 'none';
    /* 关闭动画：scale 0.95 + fade out */
    el.animate([
      { transform: 'translate3d(' + r.x + 'px,' + r.y + 'px,0) scale(1)', opacity: 1 },
      { transform: 'translate3d(' + r.x + 'px,' + (r.y + 12) + 'px,0) scale(.95)', opacity: 0 }
    ], { duration: 190, easing: 'ease-in', fill: 'forwards' })
      .onfinish = () => el.remove();
  },

  closeByApp(appId) {
    const ids = [];
    this.wins.forEach(w => { if (w.appId === appId) ids.push(w.id); });
    ids.forEach(i => this.close(i));
  },

  /* ---- 拖拽（含边缘分屏贴合） ---- */
  startDrag(win, e) {
    const el = win.el;
    const sx = e.clientX, sy = e.clientY, ox = win.rect.x, oy = win.rect.y;
    el.classList.add('dragging');
    document.body.classList.add('no-select', 'dragging');
    let snap = null;
    const move = ev => {
      win.rect.x = ox + ev.clientX - sx;
      win.rect.y = clamp(oy + ev.clientY - sy, -10, innerHeight - 60);
      this.place(win);
      snap = ev.clientY <= 3 ? 'top'
           : ev.clientX <= 3 ? 'left'
           : ev.clientX >= innerWidth - 4 ? 'right' : null;
      Snap.preview(snap);
    };
    const up = () => {
      window.removeEventListener('pointermove', move);
      window.removeEventListener('pointerup', up);
      el.classList.remove('dragging');
      document.body.classList.remove('no-select', 'dragging');
      Snap.preview(null);
      if (snap) Snap.apply(win, snap);
    };
    window.addEventListener('pointermove', move);
    window.addEventListener('pointerup', up);
  },

  /* ---- 八方向缩放 ---- */
  startResize(win, e, dir) {
    if (win.maximized) return;
    e.stopPropagation();
    const el = win.el;
    const s = { x: e.clientX, y: e.clientY, x0: win.rect.x, y0: win.rect.y, w0: win.rect.w, h0: win.rect.h };
    const minW = win.def.minW || 340, minH = win.def.minH || 240;
    el.classList.add('dragging');
    document.body.classList.add('no-select');
    const move = ev => {
      const dx = ev.clientX - s.x, dy = ev.clientY - s.y;
      let w = s.w0, h = s.h0, x = s.x0, y = s.y0;
      if (dir.indexOf('e') !== -1) w = Math.max(minW, s.w0 + dx);
      if (dir.indexOf('s') !== -1) h = Math.max(minH, s.h0 + dy);
      if (dir.indexOf('w') !== -1) { w = Math.max(minW, s.w0 - dx); x = s.x0 + (s.w0 - w); }
      if (dir.indexOf('n') !== -1) { h = Math.max(minH, s.h0 - dy); y = s.y0 + (s.h0 - h); }
      win.rect = { x, y, w, h };
      this.place(win);
    };
    const up = () => {
      window.removeEventListener('pointermove', move);
      window.removeEventListener('pointerup', up);
      el.classList.remove('dragging');
      document.body.classList.remove('no-select');
      if (typeof win.onResize === 'function') win.onResize();
    };
    window.addEventListener('pointermove', move);
    window.addEventListener('pointerup', up);
  }
};

/* ---- 分屏贴合 ---- */
const Snap = {
  kind: null,
  rectOf(kind) {
    const H = innerHeight - 64;
    if (kind === 'top')   return { x: 6, y: 6, w: innerWidth - 12, h: H };
    if (kind === 'left')  return { x: 6, y: 6, w: innerWidth / 2 - 10, h: H };
    return { x: innerWidth / 2 + 4, y: 6, w: innerWidth / 2 - 10, h: H };
  },
  preview(kind) {
    const p = $('#snap-preview');
    if (!kind) { p.classList.remove('show'); this.kind = null; return; }
    const r = this.rectOf(kind);
    p.style.transform = 'translate3d(' + r.x + 'px,' + r.y + 'px,0)';
    p.style.width = r.w + 'px';
    p.style.height = r.h + 'px';
    if (this.kind !== kind) p.classList.add('show');
    this.kind = kind;
  },
  apply(win, kind) {
    const r = this.rectOf(kind);
    const el = win.el;
    el.classList.add('anim');
    if (kind === 'top') {
      if (!win.maximized) win.prevRect = { x: win.rect.x, y: win.rect.y, w: win.rect.w, h: win.rect.h };
      win.maximized = true;
      el.classList.add('maxed');
    } else {
      win.maximized = false;
      el.classList.remove('maxed');
      win.prevRect = null;
    }
    win.rect = r;
    WM.place(win);
    setTimeout(() => {
      el.classList.remove('anim');
      if (typeof win.onResize === 'function') win.onResize();
    }, 300);
  }
};

/* ================= 托盘日历弹窗 ================= */
const TrayPop = {
  el: null, open: false, cur: null,
  init() {
    this.el = $('#tray-pop');
    $('#tk-clock').addEventListener('click', e => { e.stopPropagation(); this.toggle(); });
    document.addEventListener('pointerdown', e => {
      if (this.open && !e.target.closest('#tray-pop') && !e.target.closest('#tk-clock')) this.close();
    });
  },
  toggle(force) {
    const next = force !== undefined ? force : !this.open;
    if (next) { StartMenu.close(); this.cur = new Date(); this.render(); }
    this.open = next;
    this.el.classList.toggle('show', next);
  },
  close() { if (this.open) this.toggle(false); },
  render() {
    const d = this.cur;
    const y = d.getFullYear(), m = d.getMonth();
    const today = new Date();
    const first = new Date(y, m, 1).getDay();
    const days = new Date(y, m + 1, 0).getDate();
    const prevDays = new Date(y, m, 0).getDate();
    let html =
      '<div class="cal-head">' +
        '<div class="cal-title">' + y + ' 年 ' + (m + 1) + ' 月</div>' +
        '<div class="cal-nav">' +
          '<button data-nav="-1">‹</button><button data-nav="1">›</button>' +
        '</div>' +
      '</div><div class="cal-grid">';
    ['日','一','二','三','四','五','六'].forEach(w => { html += '<div class="cal-dow">' + w + '</div>'; });
    for (let i = first - 1; i >= 0; i--) html += '<div class="cal-d dim">' + (prevDays - i) + '</div>';
    for (let i = 1; i <= days; i++) {
      const isToday = i === today.getDate() && m === today.getMonth() && y === today.getFullYear();
      html += '<div class="cal-d' + (isToday ? ' today' : '') + '">' + i + '</div>';
    }
    const tail = (first + days) % 7;
    for (let i = 1; tail !== 0 && i <= 7 - tail; i++) html += '<div class="cal-d dim">' + i + '</div>';
    html += '</div>';
    this.el.innerHTML = html;
    $$('.cal-nav button', this.el).forEach(b => b.addEventListener('click', () => {
      this.cur = new Date(y, m + parseInt(b.dataset.nav, 10), 1);
      this.render();
    }));
  }
};

const StoreUI = {

  CATS: ['全部', '工具', '创意', '影音', '游戏', '效率'],

      '<div class="st-head">' +
        '<div class="st-hero">应用市场</div>' +

        '</div>' +

    $$('.st-chip', body).forEach(c => c.addEventListener('click', () => {

    const list = Object.keys(APPS).map(k => APPS[k])
      .filter(a => !a.core)

    grid.innerHTML = '';

    }
