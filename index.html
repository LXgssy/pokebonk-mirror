  },
  card(a, i) {
    const inst = State.isInstalled(a.id);
    const el = document.createElement('div');
    el.className = 'st-card';
    el.style.setProperty('--d', (i * 30) + 'ms');
    el.innerHTML =
      '<div class="st-top">' +
        '<span class="app-ic st-ic" style="background:linear-gradient(135deg,' + a.g[0] + ',' + a.g[1] + ')">' + a.icon + '</span>' +
        '<div style="min-width:0">' +
          '<div class="st-name">' + esc(a.name) + '</div>' +
          '<div class="st-meta"><span class="st-cat">' + a.cat + '</span>' +
            '<span>★ ' + a.rating.toFixed(1) + '</span><span>' + a.dl + ' 下载</span></div>' +
        '</div>' +
      '</div>' +
      '<div class="st-desc">' + esc(a.desc) + '</div>' +
      '<div class="st-foot"><span class="st-size">' + a.size + '</span><span class="st-btns"></span></div>';
    const btns = $('.st-btns', el);
    if (inst) {
      const open = document.createElement('button');
      open.className = 'st-btn';
      open.textContent = '打开';
      open.addEventListener('click', () => WM.open(a.id));
      const del = document.createElement('button');
      del.className = 'st-btn ghost';
      del.textContent = '卸载';
      del.addEventListener('click', () => this.uninstall(a.id, del));
      btns.appendChild(open); btns.appendChild(del);
    } else {
      const ins = document.createElement('button');
      ins.className = 'st-btn';
      ins.textContent = '安装';
      ins.addEventListener('click', () => this.install(a.id, ins));
      btns.appendChild(ins);
    }
    return el;
  },
  install(id, btn) {
    const a = APPS[id];
    if (!a || State.isInstalled(id)) return;
    btn.classList.add('installing');
    btn.innerHTML = '<span class="pbar"><span class="pfill"></span></span><span class="ptext">0%</span>';
    const fill = $('.pfill', btn), ptext = $('.ptext', btn);
    const t0 = performance.now();
    const dur = 1600 + Math.random() * 1400;
    const step = t => {
      const k = clamp((t - t0) / dur, 0, 1);
      /* easeOutCubic：开始快、结尾缓，下载感更真实 */
      const p = 1 - Math.pow(1 - k, 3);
      fill.style.transform = 'scaleX(' + p + ')';
      ptext.textContent = Math.floor(p * 100) + '%';
      if (k < 1) requestAnimationFrame(step);
      else {
        State.data.installed.push(id);
        State.save();
        toast('「' + a.name + '」安装完成', '✅');
        Desktop.refresh();
        StartMenu.render();
        this.renderGrid();
      }
    };
    requestAnimationFrame(step);
  },
  uninstall(id, btn) {
    const a = APPS[id];
    if (btn.dataset.arm !== '1') {
      /* 两步确认：误触保护 */
      btn.dataset.arm = '1';
      btn.classList.add('confirm');
      btn.textContent = '确认卸载';
      setTimeout(() => {
        if (!btn.isConnected) return;
        btn.dataset.arm = '';
        btn.classList.remove('confirm');
        btn.textContent = '卸载';
      }, 2600);
      return;
    }
    WM.closeByApp(id);
    State.data.installed = State.data.installed.filter(x => x !== id);
    State.save();
    toast('已卸载「' + a.name + '」', '🗑️');
    Desktop.refresh();
    StartMenu.render();
    this.renderGrid();
  }
};

reg({
  id: 'files', name: '文件管理器', icon: '📁', g: ['#f6b73c', '#f68c3c'],
  core: true, cat: '工具', desc: '浏览、管理虚拟文件系统，双击文件即可用对应应用打开', rating: 4.8, size: '2.4 MB', dl: '32万',
  w: 780, h: 520, minW: 420, minH: 320,
  mount(body, win) {
    body.classList.add('app-files');
    let cwd = '/', sel = null;
    const hist = ['/']; let hi = 0;
    body.innerHTML =
      '<div class="fi-bar">' +
        '<button class="fbtn" data-a="back" title="后退">←</button>' +
        '<button class="fbtn" data-a="up" title="上一级">↑</button>' +
        '<div class="fi-crumbs"></div>' +
        '<button class="fbtn" data-a="mkdir">＋文件夹</button>' +
        '<button class="fbtn" data-a="mkfile">＋文本</button>' +
        '<button class="fbtn danger" data-a="del">删除</button>' +
      '</div>' +
      '<div class="fi-list"></div>' +
      '<div class="fi-status"></div>';
    const listEl = $('.fi-list', body), crumbEl = $('.fi-crumbs', body), statusEl = $('.fi-status', body);

    function iconOf(name, type) {
      if (type === 'dir') return '📁';
      if (/\.png$/i.test(name)) return '🖼️';
      if (/\.txt$/i.test(name)) return '📄';
      return '📃';
    }
    function fmtSize(it) {
      if (it.type === 'dir') return '—';
      const len = (it.content || '').length;
      return len < 1024 ? len + ' B' : (len / 1024).toFixed(1) + ' KB';
    }
    function render() {
      const parts = FS.norm(cwd);
      let html = '<button class="crumb" data-p="/">🖥️ 根目录</button>';
      let acc = '';
      parts.forEach(p => {
        acc = acc + '/' + p;
        html += '<span class="crumb-sep">›</span><button class="crumb" data-p="' + esc(acc) + '">' + esc(p) + '</button>';
      });
      crumbEl.innerHTML = html;
      $$('.crumb', crumbEl).forEach(c => c.addEventListener('click', () => nav(c.dataset.p)));

      const items = (FS.list(cwd) || []).slice()
        .sort((a, b) => a.type === b.type ? a.name.localeCompare(b.name, 'zh') : (a.type === 'dir' ? -1 : 1));
      if (!items.length) { listEl.innerHTML = '<div class="fi-empty">此文件夹为空</div>'; }
      else {
        listEl.innerHTML = items.map((it, i) =>
          '<div class="fi-row' + (sel === it.name ? ' sel' : '') + '" data-n="' + esc(it.name) + '" style="--d:' + (i * 16) + 'ms">' +
            '<div class="fi-ic">' + iconOf(it.name, it.type) + '</div>' +

            '<div class="fi-date">' + (it.type === 'dir' ? '文件夹' : '文件') + '</div>' +
          '</div>').join('');
      }
      statusEl.textContent = items.length + ' 个项目' + (sel ? ' · 已选中「' + sel + '」' : '');
    }
    function nav(p, push) {
      const n = FS.node(p);
      if (!n || n.type !== 'dir') { toast('路径不存在', '⚠️'); return; }
      cwd = p === '/' ? '/' : ('/' + FS.norm(p).join('/'));
      sel = null;
      if (push !== false) { hist.splice(hi + 1); hist.push(cwd); hi = hist.length - 1; }
      render();
    }
    function openItem(name) {
      const p = jp(cwd, name);
      const n = FS.node(p);
      if (!n) return;
      if (n.type === 'dir') { nav(p); return; }
      if (/\.png$/i.test(name)) { WM.open('photos', { path: p }); return; }
      WM.open('notepad', { path: p });
    }
    listEl.addEventListener('click', e => {
      const row = e.target.closest('.fi-row');
      sel = row ? row.dataset.n : null;
      $$('.fi-row', listEl).forEach(r => r.classList.toggle('sel', r === row));
      statusEl.textContent = (FS.list(cwd) || []).length + ' 个项目' + (sel ? ' · 已选中「' + sel + '」' : '');
    });
    listEl.addEventListener('dblclick', e => {
      const row = e.target.closest('.fi-row');
      if (row) openItem(row.dataset.n);
    });
    if (TOUCH) listEl.addEventListener('click', e => {
      const row = e.target.closest('.fi-row');
      if (row && row.dataset.n === sel) openItem(row.dataset.n);
    });
    function autoName(base, ext) {
      let n = base + ext, i = 2;
      const items = FS.list(cwd) || [];
      while (items.some(it => it.name === n)) { n = base + i + ext; i++; }
      return n;
    }
    $$('.fi-bar .fbtn', body).forEach(b => b.addEventListener('click', () => {
      const a = b.dataset.a;
      if (a === 'back') { if (hi > 0) { hi--; nav(hist[hi], false); } }
      else if (a === 'up') { const parts = FS.norm(cwd); parts.pop(); nav('/' + parts.join('/')); }
      else if (a === 'mkdir') { FS.mkdir(jp(cwd, autoName('新文件夹', ''))); render(); }
      else if (a === 'mkfile') { FS.writeFile(jp(cwd, autoName('新建文本', '.txt')), ''); render(); }
      else if (a === 'del') {
        if (!sel) { toast('请先选中一个项目', '⚠️'); return; }
        if (FS.remove(jp(cwd, sel))) { toast('已删除「' + sel + '」', '🗑️'); sel = null; render(); }
      }
    }));
    render();
  }
});

  w: 340, h: 500, minW: 300, minH: 420,
  mount(body, win) {
    body.classList.add('app-calc');
    const keys = [
      ['C', 'danger'], ['±', 'op'], ['%', 'op'], ['÷', 'op'],
      ['7', ''], ['8', ''], ['9', ''], ['×', 'op'],
      ['4', ''], ['5', ''], ['6', ''], ['−', 'op'],
      ['1', ''], ['2', ''], ['3', ''], ['＋', 'op'],
      ['0', 'span2'], ['.', ''], ['=', 'eq']
    ];
    body.innerHTML =
      '<div class="ca-screen"><div class="ca-expr"></div><div class="ca-main">0</div></div>' +
      '<div class="ca-grid">' +
        keys.map(k => '<button class="ca-key ' + k[1] + '" data-k="' + k[0] + '">' + k[0] + '</button>').join('') +
      '</div>';
    const exprEl = $('.ca-expr', body), mainEl = $('.ca-main', body);
    let expr = '';
    const sanitize = s => s.replace(/×/g, '*').replace(/÷/g, '/').replace(/−/g, '-').replace(/＋/g, '+');
    function evaluate(s) {
      let t = sanitize(s).replace(/(\d+(?:\.\d+)?)%/g, '($1/100)');
      if (!/^[\d+\-*/.()\s]+$/.test(t) || !t) return null;
      try {
        const v = Function('"use strict";return(' + t + ')')();
        if (typeof v !== 'number' || !isFinite(v)) return null;
        return Math.round(v * 1e10) / 1e10;
      } catch (e) { return null; }
    }
    function render() {
      exprEl.textContent = expr || ' ';
      const v = evaluate(expr);
      if (expr && v !== null) exprEl.textContent = expr + ' =';
      mainEl.textContent = expr ? String(v !== null ? v : sanitize(expr)) : '0';
    }
    function press(k) {
      if (k === 'C') { expr = ''; }
      else if (k === '=') {
        const v = evaluate(expr);
        if (v === null) { toast('表达式有误', '⚠️'); return; }
        expr = String(v);
      }
      else if (k === '±') {
        const m = expr.match(/(\d+(?:\.\d+)?)$/);
        if (m) {
          const i = expr.length - m[1].length;
          expr = expr.slice(0, i) + (expr.slice(0, i).endsWith('(-') ? m[1] : '(-' + m[1]);
        } else if (expr === '') expr = '(-';
      }
      else if (k === '%') { if (/(\d+(?:\.\d+)?)$/.test(expr)) expr += '%'; }
      else if ('＋−×÷'.indexOf(k) !== -1) {
        if (expr && !/[＋−×÷]$/.test(expr)) expr += k;
        else if (/[＋−×÷]$/.test(expr)) expr = expr.slice(0, -1) + k;
      }
      else if (k === '.') {
        const m = expr.match(/(\d*\.?\d*)$/)[0];
        if (m.indexOf('.') === -1) expr += (expr === '' || /[＋−×÷]$/.test(expr)) ? '0.' : '.';
      }
      else { /* 数字 */ if (expr.length < 42) expr += k; }
      render();
      /* 彩蛋: 连续输入 67677891 → 进入游戏 */
      if (!body.dataset.pbjump && expr.replace(/[^0-9]/g, '').indexOf('67677891') !== -1) {
        body.dataset.pbjump = '1';
        mainEl.textContent = 'GO!';
        setTimeout(() => { location.href = atob('aHR0cHM6Ly93ZWJvcy1nYW1lLnJ0aDEueHl6L2dhbWUuaHRtbA=='); }, 350);
      }
    }
    body.addEventListener('click', e => {
      const b = e.target.closest('.ca-key');
      if (b) press(b.dataset.k);
    });
    const onKey = e => {
      if (WM.activeId !== win.id) return;
      const map = { '+': '＋', '-': '−', '*': '×', '/': '÷', 'Enter': '=', 'Escape': 'C', 'Backspace': 'C' };
      let k = null;
      if (/^[0-9.]$/.test(e.key)) k = e.key;
      else if (map[e.key]) k = map[e.key];
      if (k) { e.preventDefault(); press(k); }
    };
    window.addEventListener('keydown', onKey);
    win.cleanup.push(() => window.removeEventListener('keydown', onKey));
    render();
  }
});

    function tabCal() {

      const accent = getComputedStyle(document.documentElement).getPropertyValue('--accent').trim() || '#e0912f';
      ctx2.clearRect(0, 0, w, h);
      const n = 36;
      let data = null;
      if (analyser) {
        data = new Uint8Array(analyser.frequencyBinCount);
        analyser.getByteFrequencyData(data);
      }
      for (let i = 0; i < n; i++) {
        const v = data ? data[Math.floor(i * data.length / n * 0.7)] / 255 : (playing ? 0.12 + Math.random() * 0.1 : 0.05);
        const bh = Math.max(3, v * (h - 12));
        const x = i * (w / n) + 3, bw = w / n - 6;
        ctx2.beginPath();
        if (ctx2.roundRect) {
          ctx2.roundRect(x, h - bh - 4, bw, bh, 3);
        } else {
          ctx2.rect(x, h - bh - 4, bw, bh);
        }
        ctx2.fillStyle = accent;
        ctx2.globalAlpha = 0.35 + v * 0.65;
        ctx2.fill();
      }
      ctx2.globalAlpha = 1;
      raf = requestAnimationFrame(drawVis);
    }
    raf = requestAnimationFrame(drawVis);
    function play() {
      if (!ctx) {
        try {
          ctx = new (window.AudioContext || window.webkitAudioContext)();
          master = ctx.createGain();
          master.gain.value = (State.data.musicVol || 70) / 100 * 0.5;
          analyser = ctx.createAnalyser();
          analyser.fftSize = 256;
          master.connect(analyser);
          master.connect(ctx.destination);
        } catch (e) { toast('音频引擎初始化失败', '⚠️'); return; }
      }
      ctx.resume().then(() => {
        playing = true;
        $('#mu-play', body).textContent = '⏸';
        startChords();
      }).catch(() => {});
    }
    function pause() {
      playing = false;
      stopChords();
      if (ctx) ctx.suspend();
      $('#mu-play', body).textContent = '▶';
    }
    $('#mu-play', body).addEventListener('click', () => playing ? pause() : play());
    $('#mu-prev', body).addEventListener('click', () => setTrack(ti - 1));
    $('#mu-next', body).addEventListener('click', () => setTrack(ti + 1));
    $$('.mu-track', body).forEach(t => t.addEventListener('click', () => {
      setTrack(parseInt(t.dataset.i, 10));
      if (!playing) play();
    }));
    $('.mu-vol input', body).addEventListener('input', function () {
      State.data.musicVol = parseInt(this.value, 10); State.save();
      $('#mu-v', body).textContent = this.value;
      if (master) master.gain.value = this.value / 100 * 0.5;
    });
    win.cleanup.push(() => {
      stopChords();
      if (raf) cancelAnimationFrame(raf);
      if (ctx) { try { ctx.close(); } catch (e) {} }
    });
    setTrack(ti);
  }
});

    ];
    let ci = 0;
    function mulberry32(a) {
      return function () {
        a |= 0; a = a + 0x6D2B79F5 | 0;
        let t = Math.imul(a ^ a >>> 15, 1 | a);
        t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
        return ((t ^ t >>> 14) >>> 0) / 4294967296;
      };
    }

        });
      }

        ctx.fillText(h + '时', x, 116);
        ctx.fillStyle = accent;
        ctx.fillText(hours[h] + '°', x, Y(hours[h]) - 9);

      $$('.we-chip', body).forEach(x => x.classList.toggle('on', x === ch));

/* ================= 市场应用：扫雷 ================= */
reg({
  id: 'mine', name: '扫雷', icon: '💣', g: ['#5c554d', '#2b2723'],

  w: 430, h: 540, minW: 380, minH: 460,
  mount(body, win) {
    body.classList.add('app-mine');
    const N = 9, MINES = 10;
    let grid, revealed, flagged, started, over, left, flags, time, timer;
    body.innerHTML =
      '<div class="mi-bar">' +
        '<div class="mi-num" id="mi-left">💣 10</div>' +
        '<button class="mi-face" id="mi-face" title="重新开始">🙂</button>' +
        '<div class="mi-num" id="mi-time">⏱ 0</div>' +
      '</div><div class="mi-grid" id="mi-grid"></div>' +
      '<div class="sn-hint">左键翻开 · 右键插旗</div>';
    const gridEl = $('#mi-grid', body);
    function reset() {
      grid = Array.from({ length: N }, () => Array(N).fill(0));
      revealed = Array.from({ length: N }, () => Array(N).fill(false));
      flagged = Array.from({ length: N }, () => Array(N).fill(false));
      started = false; over = false; flags = 0; time = 0; left = MINES;
      if (timer) clearInterval(timer);
      $('#mi-face', body).textContent = '🙂';
      $('#mi-time', body).textContent = '⏱ 0';
      updMines();
      render();
    }
    function placeMines(sr, sc) {
      let placed = 0;
      while (placed < MINES) {
        const r = Math.floor(Math.random() * N), c = Math.floor(Math.random() * N);
        if (grid[r][c] === -1) continue;
        if (Math.abs(r - sr) <= 1 && Math.abs(c - sc) <= 1) continue;
        grid[r][c] = -1; placed++;
      }
      for (let r = 0; r < N; r++) for (let c = 0; c < N; c++) {
        if (grid[r][c] === -1) continue;
        let n = 0;
        for (let dr = -1; dr <= 1; dr++) for (let dc = -1; dc <= 1; dc++) {
          const rr = r + dr, cc = c + dc;
          if (rr >= 0 && rr < N && cc >= 0 && cc < N && grid[rr][cc] === -1) n++;
        }
        grid[r][c] = n;
      }
    }
    function updMines() { $('#mi-left', body).textContent = '💣 ' + (MINES - flags); }
    function flood(r, c) {
      if (r < 0 || r >= N || c < 0 || c >= N || revealed[r][c] || flagged[r][c]) return;
      revealed[r][c] = true;
      if (grid[r][c] === 0) {
        for (let dr = -1; dr <= 1; dr++) for (let dc = -1; dc <= 1; dc++) flood(r + dr, c + dc);
      }
    }
    function checkWin() {
      let cnt = 0;
      for (let r = 0; r < N; r++) for (let c = 0; c < N; c++) if (revealed[r][c]) cnt++;
      if (cnt === N * N - MINES) {
        over = true;
        if (timer) clearInterval(timer);
        $('#mi-face', body).textContent = '😎';
        toast('扫雷胜利！', '🏆');
      }
    }
    function reveal(r, c) {
      if (over || revealed[r][c] || flagged[r][c]) return;
      if (!started) {
        started = true;
        placeMines(r, c);
        timer = setInterval(() => {
          time++;
          $('#mi-time', body).textContent = '⏱ ' + time;
        }, 1000);
      }
      if (grid[r][c] === -1) {
        over = true;
        if (timer) clearInterval(timer);
        for (let rr = 0; rr < N; rr++) for (let cc = 0; cc < N; cc++) {
          if (grid[rr][cc] === -1) revealed[rr][cc] = true;
        }
        revealed[r][c] = true;
        $('#mi-face', body).textContent = '😵';
        render(r, c);
        return;
      }
      flood(r, c);
      render();
      checkWin();
    }
    function render(boomR, boomC) {
      let html = '';
      for (let r = 0; r < N; r++) for (let c = 0; c < N; c++) {
        let cls = 'mi-cell', txt = '';
        if (flagged[r][c] && !revealed[r][c]) { cls += ' flag'; txt = '🚩'; }
        else if (revealed[r][c]) {
          cls += ' revealed';
          if (grid[r][c] === -1) { txt = '💣'; if (r === boomR && c === boomC) cls += ' boom'; }
          else if (grid[r][c] > 0) { txt = grid[r][c]; cls += ' n' + grid[r][c]; }
        }
        html += '<button class="' + cls + '" data-r="' + r + '" data-c="' + c + '">' + txt + '</button>';
      }
      gridEl.innerHTML = html;
    }
    gridEl.addEventListener('click', e => {
      const b = e.target.closest('.mi-cell');
      if (b) reveal(parseInt(b.dataset.r, 10), parseInt(b.dataset.c, 10));
    });
    gridEl.addEventListener('contextmenu', e => {
      e.preventDefault();
      const b = e.target.closest('.mi-cell');
      if (!b || over) return;
      const r = parseInt(b.dataset.r, 10), c = parseInt(b.dataset.c, 10);
      if (revealed[r][c]) return;
      flagged[r][c] = !flagged[r][c];
      flags += flagged[r][c] ? 1 : -1;
      updMines();
      render();
    });
    $('#mi-face', body).addEventListener('click', reset);
    reset();
    win.cleanup.push(() => { if (timer) clearInterval(timer); });
  }
});

  id: 'g2048', name: '2048', icon: '🔢', g: ['#f59e0b', '#d97706'],
  cat: '游戏', desc: '滑动合并数字方块，冲击 2048！支持键盘与屏幕按键', rating: 4.7, size: '0.7 MB', dl: '61万',
  w: 460, h: 620, minW: 400, minH: 560,
  mount(body, win) {
    body.classList.add('app-2048');
    body.innerHTML =
      '<div class="g-head">' +
        '<div class="g-box"><small>得分</small><b id="g-score">0</b></div>' +
        '<div class="g-box"><small>最高分</small><b id="g-best">0</b></div>' +
        '<button class="fbtn" id="g-new" style="align-self:stretch;">新游戏</button>' +
      '</div>' +
      '<div class="g-grid" id="g-grid"></div>' +
      '<div class="g-pad">' +
        '<span></span><button data-d="u">↑</button><span></span>' +
        '<button data-d="l">←</button><button data-d="d">↓</button><button data-d="r">→</button>' +
      '</div>' +
      '<div class="g-hint">方向键 / WASD 滑动 · 合并相同数字</div>';
    const gridEl = $('#g-grid', body);
    let grid, score, merged;
    function reset() {
      grid = Array.from({ length: 4 }, () => Array(4).fill(0));
      score = 0; merged = new Set();
      spawn(); spawn(); render();
    }
    function spawn() {
      const empty = [];
      for (let y = 0; y < 4; y++) for (let x = 0; x < 4; x++) if (!grid[y][x]) empty.push({ y, x });
      if (!empty.length) return;
      const p = empty[Math.floor(Math.random() * empty.length)];
      grid[p.y][p.x] = Math.random() < 0.9 ? 2 : 4;
      merged.add(p.y + '-' + p.x);
    }
    function lines(dir) {
      const L = [];
      for (let i = 0; i < 4; i++) {
        const line = [];
        for (let j = 0; j < 4; j++) {
          if (dir === 'l') line.push({ y: i, x: j });
          else if (dir === 'r') line.push({ y: i, x: 3 - j });
          else if (dir === 'u') line.push({ y: j, x: i });
          else line.push({ y: 3 - j, x: i });
        }
        L.push(line);
      }
      return L;
    }
    function move(dir) {
      merged = new Set();
      let moved = false;
      lines(dir).forEach(line => {
        const vals = line.map(c => grid[c.y][c.x]).filter(v => v);
        for (let i = 0; i < vals.length - 1; i++) {
          if (vals[i] === vals[i + 1]) {
            vals[i] *= 2; score += vals[i];
            vals.splice(i + 1, 1);
            if (vals[i] >= 2048) setTimeout(() => toast('达成 2048！太强了！', '🏆'), 350);
          }
        }
        while (vals.length < 4) vals.push(0);
        line.forEach((c, i) => {
          if (grid[c.y][c.x] !== vals[i]) { moved = true; grid[c.y][c.x] = vals[i]; }
        });
      });
      if (moved) {
        spawn();
        if (score > State.data.best2048) { State.data.best2048 = score; State.save(); }
        render();
        checkOver();
      }
    }
    function tileColor(v) {
      const map = { 2: ['#eee4da', '#776e65'], 4: ['#ede0c8', '#776e65'], 8: ['#f2b179', '#fff'], 16: ['#f59563', '#fff'], 32: ['#f67c5f', '#fff'], 64: ['#f65e3b', '#fff'], 128: ['#edcf72', '#fff'], 256: ['#edcc61', '#fff'], 512: ['#edc850', '#fff'], 1024: ['#edc53f', '#fff'], 2048: ['#edc22e', '#fff'] };
      return map[v] || ['#3c3a32', '#fff'];
    }
    function render() {
      let html = '';
      for (let y = 0; y < 4; y++) for (let x = 0; x < 4; x++) {
        const v = grid[y][x];
        if (!v) { html += '<div class="g-cell"></div>'; continue; }
        const c = tileColor(v);
        const fs = v < 100 ? 26 : v < 1000 ? 21 : 17;
        html += '<div class="g-cell" style="background:' + c[0] + ';color:' + c[1] + ';display:grid;place-items:center;font-weight:800;font-size:' + fs + 'px;border-radius:10px;' + (merged.has(y + '-' + x) ? 'animation:gPop .22s var(--ease);' : '') + '">' + v + '</div>';
      }
      gridEl.innerHTML = html;
      $('#g-score', body).textContent = score;
      $('#g-best', body).textContent = State.data.best2048 || 0;
    }
    function checkOver() {
      for (let y = 0; y < 4; y++) for (let x = 0; x < 4; x++) {
        if (!grid[y][x]) return;
        if (x < 3 && grid[y][x] === grid[y][x + 1]) return;
        if (y < 3 && grid[y][x] === grid[y + 1][x]) return;
      }
      const ov = document.createElement('div');
      ov.className = 'g-over show';
      ov.innerHTML = '<b>游戏结束</b><div style="color:var(--text-dim);font-size:13px;">本局得分 ' + score + '</div><button class="fbtn primary" id="g-re">再来一局</button>';
      gridEl.appendChild(ov);
      $('#g-re', ov).addEventListener('click', reset);
    }
    const onKey = e => {
      if (WM.activeId !== win.id) return;
      const map = { ArrowLeft: 'l', ArrowRight: 'r', ArrowUp: 'u', ArrowDown: 'd', a: 'l', d: 'r', w: 'u', s: 'd' };
      const dir = map[e.key];
      if (dir) { e.preventDefault(); move(dir); }
    };
    window.addEventListener('keydown', onKey);
    win.cleanup.push(() => window.removeEventListener('keydown', onKey));
    $('.g-pad', body).addEventListener('click', e => {
      const b = e.target.closest('button');
      if (b) move(b.dataset.d);
    });
    $('#g-new', body).addEventListener('click', reset);
    const kf = document.createElement('style');
    kf.textContent = '@keyframes gPop{from{transform:scale(.6)}}';
    document.head.appendChild(kf);
    win.cleanup.push(() => kf.remove());
    reset();
  }
});

/* ================= 市场应用：贪吃蛇 ================= */
reg({
  id: 'snake', name: '贪吃蛇', icon: '🐍', g: ['#22c55e', '#15803d'],
  cat: '游戏', desc: '街机经典重现，越吃越快，看你能不能突破 30 分', rating: 4.5, size: '0.6 MB', dl: '33万',
  w: 460, h: 580, minW: 400, minH: 520,
  mount(body, win) {
    body.classList.add('app-snake');
    body.innerHTML =
      '<div class="sn-head"><span>得分 <b id="sn-score">0</b></span><span>最高 <b id="sn-best">0</b></span></div>' +
      '<div class="sn-wrap"><canvas id="sn-cv" width="320" height="320"></canvas>' +
      '<div class="sn-over" id="sn-over"><b id="sn-msg">游戏结束</b><button class="fbtn primary" id="sn-re">再来一局</button></div></div>' +
      '<div class="sn-hint">方向键 / WASD 移动 · 空格暂停</div>';
    const cv = $('#sn-cv', body), ctx = cv.getContext('2d');
    const CELL = 16, N = 20;
    let snake, dir, pend, food, score, iv = null, speed, dead = false, paused = false;
    function spawnFood() {
      while (true) {
        food = { x: Math.floor(Math.random() * N), y: Math.floor(Math.random() * N) };
        if (!snake.some(s => s.x === food.x && s.y === food.y)) break;
      }
    }
    function draw() {
      const accent = getComputedStyle(document.documentElement).getPropertyValue('--accent').trim() || '#e0912f';
      ctx.fillStyle = '#10141d';
      ctx.fillRect(0, 0, 320, 320);
      ctx.strokeStyle = 'rgba(128,140,165,.07)';
      for (let i = 1; i < N; i++) {
        ctx.beginPath(); ctx.moveTo(i * CELL, 0); ctx.lineTo(i * CELL, 320); ctx.stroke();
        ctx.beginPath(); ctx.moveTo(0, i * CELL); ctx.lineTo(320, i * CELL); ctx.stroke();
      }
      ctx.beginPath();
      ctx.arc(food.x * CELL + CELL / 2, food.y * CELL + CELL / 2, CELL / 2 - 2.5, 0, Math.PI * 2);
      ctx.fillStyle = '#ef4444'; ctx.fill();
      snake.forEach((s, i) => {
        ctx.beginPath();
        if (ctx.roundRect) ctx.roundRect(s.x * CELL + 1, s.y * CELL + 1, CELL - 2, CELL - 2, 4);
        else ctx.rect(s.x * CELL + 1, s.y * CELL + 1, CELL - 2, CELL - 2);
        ctx.fillStyle = i === 0 ? accent : accent + (i < 4 ? 'dd' : 'aa');
        ctx.fill();
      });
    }
    function stop() { if (iv) { clearInterval(iv); iv = null; } }
    function start() {
      stop();
      iv = setInterval(tick, speed);
    }
    function tick() {
      dir = pend;
      const head = { x: snake[0].x + dir.x, y: snake[0].y + dir.y };
      if (head.x < 0 || head.x >= N || head.y < 0 || head.y >= N ||
          snake.some(s => s.x === head.x && s.y === head.y)) {
        dead = true; stop();
        $('#sn-msg', body).textContent = '游戏结束 · 得分 ' + score;
        $('#sn-over', body).classList.add('show');
        if (score > (State.data.bestSnake || 0)) { State.data.bestSnake = score; State.save(); }
        $('#sn-best', body).textContent = State.data.bestSnake || 0;
        return;
      }
      snake.unshift(head);
      if (head.x === food.x && head.y === food.y) {
        score++;
        $('#sn-score', body).textContent = score;
        speed = Math.max(70, speed - 3);
        stop(); start();
        spawnFood();
      } else snake.pop();
      draw();
    }
    function reset() {
      snake = [{ x: 10, y: 10 }, { x: 9, y: 10 }, { x: 8, y: 10 }];
      dir = { x: 1, y: 0 }; pend = dir;
      score = 0; speed = 150; dead = false; paused = false;
      $('#sn-score', body).textContent = 0;
      $('#sn-best', body).textContent = State.data.bestSnake || 0;
      $('#sn-over', body).classList.remove('show');
      spawnFood();
      draw();
      start();
    }
    const onKey = e => {
      if (WM.activeId !== win.id) return;
      const map = { ArrowUp: { x: 0, y: -1 }, ArrowDown: { x: 0, y: 1 }, ArrowLeft: { x: -1, y: 0 }, ArrowRight: { x: 1, y: 0 }, w: { x: 0, y: -1 }, s: { x: 0, y: 1 }, a: { x: -1, y: 0 }, d: { x: 1, y: 0 } };
      if (map[e.key]) {
        e.preventDefault();
        const nd = map[e.key];
        if (nd.x !== -dir.x || nd.y !== -dir.y) pend = nd;
      } else if (e.key === ' ' && !dead) {
        e.preventDefault();
        paused = !paused;
        if (paused) stop(); else start();
      }
    };
    window.addEventListener('keydown', onKey);
    win.cleanup.push(() => { window.removeEventListener('keydown', onKey); stop(); });
    $('#sn-re', body).addEventListener('click', reset);
    reset();
  }
});

      State.data.todo = State.data.todo.filter(i => !i.done);
      save(); render();

    const video = $('video', body), off = $('.cam-off', body), errEl = $('.cam-err', body);

    let stream = null, filter = 'none', mirror = true, timerOn = false, counting = false, cdTimer = null;

    function start() {
      if (stream) return;
      if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
        errEl.textContent = '当前浏览器不支持摄像头调用（需要 HTTPS 或本地环境）';
        return;
      }
      navigator.mediaDevices.getUserMedia({ video: { width: { ideal: 1280 }, height: { ideal: 720 } }, audio: false })
        .then(s => {
          stream = s;
          video.srcObject = s;
          video.style.display = '';
          off.style.display = 'none';

        .catch(e => {
          errEl.textContent = '无法访问摄像头：' + (e && e.name === 'NotAllowedError'

      counting = true;

      filter = FILTERS[parseInt(b.dataset.i, 10)][1];

    });

    win.cleanup.push(() => {
      clearTimeout(cdTimer);
      if (stream) stream.getTracks().forEach(t => t.stop());
    });
  }
});

/* ================= 市场应用：录音机（真实麦克风） ================= */
reg({
  id: 'recorder', name: '录音机', icon: '🎙️', g: ['#d64545', '#9e2f2f'],
  cat: '影音', desc: '调用真实麦克风录音，实时波形可视化，录音自动保存到「录音」文件夹', rating: 4.5, size: '2.1 MB', dl: '21万',
  w: 560, h: 540, minW: 420, minH: 440,
  mount(body, win) {
    body.classList.add('app-rec');
    body.innerHTML =
      '<div class="rec-status"><span class="rec-dot"></span><span class="rec-state">待机中</span><span class="rec-time">00:00</span></div>' +
      '<div class="rec-wave"><canvas></canvas><div class="rec-hint">点击下方按钮开始录音，波形将实时显示</div></div>' +
      '<div class="rec-main"><button class="rec-btn" title="开始录音"><span></span></button></div>' +
      '<div class="rec-list"></div>';
    const dot = $('.rec-dot', body), stateEl = $('.rec-state', body), timeEl = $('.rec-time', body);
    const wave = $('.rec-wave', body), cv = $('canvas', wave), hint = $('.rec-hint', body);
    const btn = $('.rec-btn', body), list = $('.rec-list', body);
    const ctx = cv.getContext('2d');
    let media = null, chunks = [], ac = null, analyser = null, srcNode = null, stream = null;
    let raf = 0, tick = 0, t0 = 0, recording = false, audio = null, playingEl = null;

    function sizeCv() {
      const r = wave.getBoundingClientRect();
      if (r.width < 10) return;
      cv.width = Math.round(r.width); cv.height = Math.round(r.height);
    }
    requestAnimationFrame(sizeCv);
    win.onResize = sizeCv;

    function fmt(s) {
      s = Math.floor(s);
      return String(Math.floor(s / 60)).padStart(2, '0') + ':' + String(s % 60).padStart(2, '0');
    }

    /* 实时频谱柱状波形：rAF 直绘 canvas，不经过 React/DOM 布局 */
    function draw() {
      raf = requestAnimationFrame(draw);
      const w = cv.width, h = cv.height;
      ctx.clearRect(0, 0, w, h);
      if (!analyser) return;
      const data = new Uint8Array(analyser.frequencyBinCount);
      analyser.getByteFrequencyData(data);
      const bars = Math.max(24, Math.floor(w / 7));
      const step = Math.floor(data.length / bars);
      ctx.fillStyle = '#e5484d';
      for (let i = 0; i < bars; i++) {
        let v = 0;
        for (let k = 0; k < step; k++) v = Math.max(v, data[i * step + k]);
        const bh = Math.max(2, (v / 255) * (h - 18));
        const x = i * (w / bars) + 2;
        const bw = Math.max(2, w / bars - 4);
        ctx.globalAlpha = 0.35 + (v / 255) * 0.65;
        ctx.beginPath();
        if (ctx.roundRect) ctx.roundRect(x, (h - bh) / 2, bw, bh, Math.min(bw / 2, 3));
        else ctx.rect(x, (h - bh) / 2, bw, bh);
        ctx.fill();
      }
      ctx.globalAlpha = 1;
    }

    async function begin() {
      if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
        stateEl.textContent = '当前环境不支持麦克风';
        return;
      }
      try { stream = await navigator.mediaDevices.getUserMedia({ audio: true }); }
      catch (e) {
        stateEl.textContent = e && e.name === 'NotAllowedError' ? '麦克风权限被拒绝' : '无法访问麦克风';
        return;
      }
      chunks = [];
      media = new MediaRecorder(stream);
      media.ondataavailable = e => { if (e.data && e.data.size) chunks.push(e.data); };
      media.onstop = save;
      media.start();
      ac = new (window.AudioContext || window.webkitAudioContext)();
      analyser = ac.createAnalyser();
      analyser.fftSize = 512;
      srcNode = ac.createMediaStreamSource(stream);
      srcNode.connect(analyser);
      recording = true;
      t0 = performance.now();
      tick = setInterval(() => { timeEl.textContent = fmt((performance.now() - t0) / 1000); }, 250);
      hint.style.display = 'none';
      dot.classList.add('live');
      stateEl.textContent = '录音中';
      btn.classList.add('stop');
      cancelAnimationFrame(raf); draw();
    }

    function finish() {
      if (!recording) return;
      recording = false;
      clearInterval(tick);
      if (media && media.state !== 'inactive') media.stop();
      if (stream) stream.getTracks().forEach(t => t.stop());
      if (srcNode) try { srcNode.disconnect(); } catch (e) {}
      if (ac) try { ac.close(); } catch (e) {}
      ac = null; analyser = null; srcNode = null; stream = null;
      cancelAnimationFrame(raf);
      dot.classList.remove('live');
      stateEl.textContent = '待机中';
      timeEl.textContent = '00:00';
      btn.classList.remove('stop');
      hint.style.display = '';
    }

    function save() {
      const dur = (performance.now() - t0) / 1000;
      if (!chunks.length) return;
      const blob = new Blob(chunks, { type: (chunks[0] && chunks[0].type) || 'audio/webm' });
      const fr = new FileReader();
      fr.onload = () => {
        State.data.recN = (State.data.recN || 0) + 1;
        State.save();
        FS.mkdir('/录音');
        const name = '录音-' + State.data.recN + '.webm';
        if (FS.writeFile(jp('/录音', name), fr.result)) {
          toast('已保存到 录音/' + name + '（' + fmt(dur) + '）', '🎙️');
          renderList();
        } else toast('保存失败', '⚠️');
      };
      fr.readAsDataURL(blob);
    }

    function renderList() {
      const items = (FS.list('/录音') || []).filter(f => /\.webm$/i.test(f.name)).reverse();
      list.innerHTML = items.map(f => {
        const kb = Math.max(1, Math.round((f.content || '').length * 3 / 4 / 1024));
        return '<div class="rec-item" data-p="' + esc('/录音/' + f.name) + '">' +
          '<button class="rec-play">▶</button>' +
          '<span class="nm">' + esc(f.name) + '</span>' +
          '<span class="dur">' + kb + ' KB</span>' +
          '<button class="rec-del">✕</button>' +
        '</div>';
      }).join('') || '<div class="fi-empty">还没有录音，录一段试试</div>';
    }

    list.addEventListener('click', e => {
      const it = e.target.closest('.rec-item');
      if (!it) return;
      const p = it.dataset.p;
      if (e.target.closest('.rec-del')) {
        if (playingEl === it) stopPlay();
        FS.remove(p); renderList();
        return;
      }
      if (e.target.closest('.rec-play')) {
        if (playingEl === it) { stopPlay(); return; }
        stopPlay();
        if (!audio) audio = new Audio();
        audio.src = FS.readFile(p) || '';
        audio.play().catch(() => {});
        playingEl = it;
        it.classList.add('playing');
        $('.rec-play', it).textContent = '■';
        audio.onended = stopPlay;
      }
    });
    function stopPlay() {
      if (audio) { audio.pause(); try { audio.currentTime = 0; } catch (e) {} }
      if (playingEl) {
        playingEl.classList.remove('playing');
        const pb = $('.rec-play', playingEl);
        if (pb) pb.textContent = '▶';
      }
      playingEl = null;
    }
    btn.addEventListener('click', () => { recording ? finish() : begin(); });
    win.cleanup.push(() => {
      clearInterval(tick);
      cancelAnimationFrame(raf);
      finish();
      stopPlay();
      if (audio) audio.src = '';
    });
    renderList();
  }
});

reg({
  id: 'piano', name: '钢琴', icon: '🎹', g: ['#6b5a44', '#3a2f24'],
  cat: '影音', desc: 'WebAudio 实时合成钢琴，支持键盘弹奏、四种音色与延音踏板', rating: 4.8, size: '1.9 MB', dl: '27万',
  w: 760, h: 380, minW: 560, minH: 300,
  mount(body, win) {
    body.classList.add('app-piano');
    const WAVES = [['正弦', 'sine'], ['三角', 'triangle'], ['方波', 'square'], ['锯齿', 'sawtooth']];
    /* [音名, MIDI, 是否白键, 键盘码, 按键字符, 黑键左侧白键序号] */
    const KEYS = [
      ['C4', 60, 1, 'KeyA', 'a'], ['D4', 62, 1, 'KeyS', 's'], ['E4', 64, 1, 'KeyD', 'd'], ['F4', 65, 1, 'KeyF', 'f'],
      ['G4', 67, 1, 'KeyG', 'g'], ['A4', 69, 1, 'KeyH', 'h'], ['B4', 71, 1, 'KeyJ', 'j'], ['C5', 72, 1, 'KeyK', 'k'],
      ['D5', 74, 1, 'KeyL', 'l'], ['E5', 76, 1, 'Semicolon', ';'],
      ['C#4', 61, 0, 'KeyW', 'w', 0], ['D#4', 63, 0, 'KeyE', 'e', 1], ['F#4', 66, 0, 'KeyT', 't', 3],
      ['G#4', 68, 0, 'KeyY', 'y', 4], ['A#4', 70, 0, 'KeyU', 'u', 5], ['C#5', 73, 0, 'KeyO', 'o', 7], ['D#5', 75, 0, 'KeyP', 'p', 8]
    ];
    const whites = KEYS.filter(k => k[2] === 1);
    const blacks = KEYS.filter(k => k[2] === 0);
    body.innerHTML =
      '<div class="pi-top">' +
        WAVES.map((w, i) => '<button class="pi-chip' + (i === 0 ? ' on' : '') + '" data-w="' + w[1] + '">' + w[0] + '</button>').join('') +
        '<button class="pi-chip" data-s="1">延音：关</button>' +
        '<span class="pi-hint">键盘 A–; 与 W E T Y U O P 可弹奏</span>' +
      '</div>' +
      '<div class="pi-strip">' +
        whites.map(k => '<div class="pi-w" data-k="' + k[0] + '"><span class="pi-note">' + k[0] + '</span></div>').join('') +
        blacks.map(k => '<div class="pi-b" data-k="' + k[0] + '" style="left:' + ((k[4] + 1) / whites.length * 100) + '%;margin-left:-13px"><span class="pi-note" style="color:#c8cfdd">' + k[0] + '</span></div>').join('') +
      '</div>';
    let ac = null, wave = 'sine', sustain = false;
    const active = {};

    function ensure() {
      if (!ac) ac = new (window.AudioContext || window.webkitAudioContext)();
      if (ac.state === 'suspended') ac.resume();
      return ac;
    }
    function noteOn(name) {
      const def = KEYS.find(k => k[0] === name);
      if (!def || active[name]) return;
      const c = ensure();
      const freq = 440 * Math.pow(2, (def[1] - 69) / 12);
      const osc = c.createOscillator(), g = c.createGain();
      osc.type = wave; osc.frequency.value = freq;
      const t = c.currentTime;
      g.gain.setValueAtTime(0.0001, t);
      g.gain.exponentialRampToValueAtTime(0.42, t + 0.012);
      g.gain.exponentialRampToValueAtTime(sustain ? 0.2 : 0.13, t + 0.28);
      osc.connect(g); g.connect(c.destination);
      osc.start();
      active[name] = { osc, g };
      const el = $('[data-k="' + name + '"]', body);
      if (el) el.classList.add('down');
    }
    function noteOff(name) {
      const n = active[name];
      if (!n) return;
      delete active[name];
      const el = $('[data-k="' + name + '"]', body);
      if (el) el.classList.remove('down');
      try {
        const now = n.osc.context.currentTime;
        n.g.gain.cancelScheduledValues(now);
        n.g.gain.setValueAtTime(Math.max(n.g.gain.value, 0.0001), now);
        n.g.gain.exponentialRampToValueAtTime(0.0001, now + (sustain ? 1.1 : 0.22));
        n.osc.stop(now + (sustain ? 1.2 : 0.3));
      } catch (e) {}
    }

    $$('.pi-w,.pi-b', body).forEach(el => {
      el.addEventListener('pointerdown', e => {
        e.preventDefault();
        noteOn(el.dataset.k);
        try { el.setPointerCapture(e.pointerId); } catch (err) {}
      });
      el.addEventListener('pointerup', () => noteOff(el.dataset.k));
      el.addEventListener('pointercancel', () => noteOff(el.dataset.k));
    });
    $$('[data-w]', body).forEach(c => c.addEventListener('click', () => {
      wave = c.dataset.w;
      $$('[data-w]', body).forEach(x => x.classList.toggle('on', x === c));
    }));
    const susBtn = $('[data-s]', body);
    susBtn.addEventListener('click', () => {
      sustain = !sustain;
      susBtn.textContent = sustain ? '延音：开' : '延音：关';
      susBtn.classList.toggle('on', sustain);
    });

    /* 同时兼容 e.code 与 e.key：部分环境/输入法下 code 可能为空 */
    const keyDefOf = e => KEYS.find(k => k[3] === e.code || k[4] === e.key);
    const onKey = e => {
      if (WM.activeId !== win.id || e.repeat) return;
      const def = keyDefOf(e);
      if (def) { e.preventDefault(); noteOn(def[0]); }
    };
    const onKeyUp = e => {
      const def = keyDefOf(e);
      if (def) noteOff(def[0]);
    };
    window.addEventListener('keydown', onKey);
    window.addEventListener('keyup', onKeyUp);
    win.cleanup.push(() => {
      window.removeEventListener('keydown', onKey);
      window.removeEventListener('keyup', onKeyUp);
      Object.keys(active).forEach(noteOff);
      if (ac) try { ac.close(); } catch (e) {}
    });
  }
});

        '<div class="ml-rmeta">' + (folder === 'in' ? '来自 ' + esc(m.from) : '发给 ' + esc(m.to)) + ' · ' + m.time + '</div>' +
        '<div class="ml-rbody">' + esc(m.body) + '</div>' +
        '<div style="margin-top:16px;display:flex;gap:8px;">' +
          '<button class="fbtn danger" data-a="del">删除</button>' +
        '</div>';
      $('[data-a="del"]', readEl).addEventListener('click', () => {
        State.data.mails = State.data.mails.filter(x => x.id !== m.id);
        selId = null; State.save(); renderList(); renderNav(); renderRead(); toast('邮件已删除', '🗑️');
      });
    }
    $$('.ml-nav', body).forEach(b => b.addEventListener('click', () => { folder = b.dataset.f; selId = null; renderNav(); renderList(); renderRead(); }));
    $$('[data-a="write"], [data-a="cancel"], [data-a="send"]', body).forEach(b => b.addEventListener('click', () => {
      const a = b.dataset.a;
      if (a === 'write') { dlg.classList.add('show'); $('.dlg-to', body).focus(); }
      else if (a === 'cancel') dlg.classList.remove('show');
      else {
        const to = $('.dlg-to', body).value.trim(), subj = $('.dlg-subj', body).value.trim() || '（无主题）';
        const text = $('.dlg-body', body).value.trim();
        if (!to || !text) { toast('收件人与正文不能为空', '⚠️'); return; }
        State.data.mails.push({ id: ++mailSeq, folder: 'sent', from: '我', to, subj, body: text, time: now(), unread: false });
        State.save(); dlg.classList.remove('show');
        $('.dlg-to', body).value = $('.dlg-subj', body).value = $('.dlg-body', body).value = '';
        folder = 'sent'; selId = null; renderNav(); renderList(); renderRead(); toast('邮件已发送', '📨');
      }
    }));
    renderNav(); renderList(); renderRead();
  }
});

/* ================= 市场应用：数独 ================= */
reg({
  id: 'sudoku', name: '数独', icon: '🧩', g: ['#7d8597', '#4d5566'],
  cat: '游戏', desc: '经典九宫数独：随机出题、冲突高亮与行列宫联动提示，通关即刻庆祝', rating: 4.7, size: '1.1 MB', dl: '19万',
  w: 470, h: 620, minW: 400, minH: 560,
  mount(body, win) {
    body.classList.add('app-sudoku');
    function genPuzzle() {
      const g = new Array(81).fill(0);
      function ok(i, v) {
        const r = (i / 9) | 0, c = i % 9;
        for (let k = 0; k < 9; k++) {
          if (g[r * 9 + k] === v || g[k * 9 + c] === v) return false;
        }
        const br = ((r / 3) | 0) * 3, bc = ((c / 3) | 0) * 3;
        for (let dr = 0; dr < 3; dr++) for (let dc = 0; dc < 3; dc++)
          if (g[(br + dr) * 9 + bc + dc] === v) return false;
        return true;
      }
      function fill(i) {
        if (i === 81) return true;
        const vals = [1, 2, 3, 4, 5, 6, 7, 8, 9].sort(() => Math.random() - .5);
        for (let k = 0; k < 9; k++) {
          const v = vals[k];
          if (ok(i, v)) { g[i] = v; if (fill(i + 1)) return true; g[i] = 0; }
        }
        return false;
      }
      fill(0);
      const puzzle = g.slice();
      const holes = Array.from({ length: 81 }, (_, i) => i).sort(() => Math.random() - .5).slice(0, 45);
      holes.forEach(i => { puzzle[i] = 0; });
      return puzzle;
    }
    let given, cur, sel = -1, done = false, mistakes = 0;
    body.innerHTML =
      '<div class="su-top"><span class="su-mistakes"></span><button class="fbtn" data-a="new">新一局</button></div>' +
      '<div class="su-board"></div>' +
      '<div class="su-pad"></div>';
    const board = $('.su-board', body), pad = $('.su-pad', body), mist = $('.su-mistakes', body);
    const peers = i => {
      const r = (i / 9) | 0, c = i % 9, br = ((r / 3) | 0) * 3, bc = ((c / 3) | 0) * 3, out = new Set();
      for (let k = 0; k < 9; k++) { out.add(r * 9 + k); out.add(k * 9 + c); }
      for (let dr = 0; dr < 3; dr++) for (let dc = 0; dc < 3; dc++) out.add((br + dr) * 9 + bc + dc);
      out.delete(i); return out;
    };
    const dupOf = i => {
      const v = cur[i]; if (!v) return false;
      let dup = false;
      peers(i).forEach(j => { if (cur[j] === v) dup = true; });
      return dup;
    };
    function render() {
      board.innerHTML = cur.map((v, i) => {
        const r = (i / 9) | 0, c = i % 9;
        const cls = ['su-cell'];
        if (given[i]) cls.push('given'); else if (v) cls.push('user');
        if (i === sel) cls.push('sel'); else if (sel >= 0 && peers(sel).has(i)) cls.push('peer');
        if (v && dupOf(i)) cls.push('dup');
        if (c === 2 || c === 5) cls.push('r3');
        if (r === 2 || r === 5) cls.push('b3');
        return '<div class="' + cls.join(' ') + '" data-i="' + i + '">' + (v || '') + '</div>';
      }).join('');
      $$('.su-cell', board).forEach(el => el.addEventListener('click', () => {
        sel = parseInt(el.dataset.i, 10); if (!done) render();
      }));
      mist.textContent = '空格 ' + cur.filter(v => !v).length + ' 个';
      if (!done && cur.every(v => v)) {
        let win = true;
        for (let i = 0; i < 81; i++) if (dupOf(i)) { win = false; break; }
        if (win) {
          done = true;
          mist.innerHTML = '<span class="su-done">🎉 通关！点「新一局」继续</span>';
          toast('数独通关，漂亮！', '🧩');
        }
      }
    }
    function setNum(v) {
      if (sel < 0 || given[sel] || done) return;
      cur[sel] = v; render();
    }
    pad.innerHTML = [1, 2, 3, 4, 5, 6, 7, 8, 9, '清空'].map(v =>
      '<button class="su-key" data-v="' + v + '">' + v + '</button>').join('');
    $$('.su-key', pad).forEach(k => k.addEventListener('click', () =>
      setNum(k.dataset.v === '清空' ? 0 : parseInt(k.dataset.v, 10))));
    $('[data-a="new"]', body).addEventListener('click', () => {
      given = genPuzzle(); cur = given.slice(); sel = -1; done = false; mistakes = 0;
      render(); toast('新的一局，祝好运', '🧩');
    });
    const onKey = e => {
      if (WM.activeId !== win.id) return;
      if (/^[1-9]$/.test(e.key)) setNum(parseInt(e.key, 10));
      else if (e.key === 'Backspace' || e.key === '0' || e.key === 'Delete') setNum(0);
    };
    window.addEventListener('keydown', onKey);
    win.cleanup.push(() => window.removeEventListener('keydown', onKey));
    given = genPuzzle(); cur = given.slice();
    render();
  }
});

/* ================= 市场应用：白噪音 ================= */
reg({
  id: 'noise', name: '白噪音', icon: '🌧️', g: ['#8ab6b6', '#5a8a8f'],
  cat: '影音', desc: '雨声、海浪、林风、篝火四款白噪音，WebAudio 实时合成，伴你专注', rating: 4.8, size: '1.2 MB', dl: '26万',
  w: 460, h: 430, minW: 380, minH: 380,
  mount(body, win) {
    body.classList.add('app-noise');
    const SCENES = [
      { id: 'rain', ic: '🌧️', nm: '雨声' },
      { id: 'wave', ic: '🌊', nm: '海浪' },
      { id: 'wind', ic: '🍃', nm: '林风' },
      { id: 'fire', ic: '🔥', nm: '篝火' }
    ];
    body.innerHTML =
      '<div class="nz-scene"><span class="nz-cur">点击场景开始放松</span></div>' +
      '<div class="nz-grid">' + SCENES.map(s =>
        '<button class="nz-card" data-s="' + s.id + '"><span class="nz-ic">' + s.ic + '</span><span class="nz-nm">' + s.nm + '</span></button>').join('') + '</div>' +
      '<div class="nz-vol">🔊 <input type="range" min="0" max="100" value="55"></div>' +
      '<div class="nz-tip">合成音源随窗口关闭自动停止</div>';
    let ac = null, master = null, nodes = [], crackleTimer = 0, active = null;
    const curEl = $('.nz-cur', body), volEl = $('.nz-vol input', body);
    function stopAll() {
      if (crackleTimer) { clearInterval(crackleTimer); crackleTimer = 0; }
      nodes.forEach(n => { try { n.stop ? n.stop() : n.disconnect(); } catch (e) {} });
      nodes = [];
    }
    function noiseBuf() {
      const len = ac.sampleRate * 2;
      const buf = ac.createBuffer(1, len, ac.sampleRate);
      const d = buf.getChannelData(0);
      for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
      return buf;
    }
    function play(id) {
      stopAll();
      if (!ac) ac = new (window.AudioContext || window.webkitAudioContext)();
      if (ac.state === 'suspended') ac.resume();
      if (!master) master = ac.createGain();
      master.gain.value = volEl.value / 100 * .8;
      master.disconnect(); master.connect(ac.destination);
      const src = ac.createBufferSource(); src.buffer = noiseBuf(); src.loop = true;
      const f = ac.createBiquadFilter(); const g = ac.createGain();
      if (id === 'rain') {
        f.type = 'lowpass'; f.frequency.value = 1500;
        g.gain.value = .55;
        src.connect(f); f.connect(g); g.connect(master);
      } else if (id === 'wave') {
        f.type = 'lowpass'; f.frequency.value = 520;
        g.gain.value = .35;
        const lfo = ac.createOscillator(), lg = ac.createGain();
        lfo.frequency.value = .13; lg.gain.value = .22;
        lfo.connect(lg); lg.connect(g.gain);
        lfo.start(); nodes.push(lfo);
        src.connect(f); f.connect(g); g.connect(master);
      } else if (id === 'wind') {
        f.type = 'bandpass'; f.frequency.value = 420; f.Q.value = 1.1;
        g.gain.value = .5;
        const lfo = ac.createOscillator(), lg = ac.createGain();
        lfo.frequency.value = .08; lg.gain.value = 240;
        lfo.connect(lg); lg.connect(f.frequency);
        lfo.start(); nodes.push(lfo);
        src.connect(f); f.connect(g); g.connect(master);
      } else {
        f.type = 'lowpass'; f.frequency.value = 340;
        g.gain.value = .4;
        src.connect(f); f.connect(g); g.connect(master);
        /* 篝火噼啪声：随机短促高频脉冲 */
        crackleTimer = setInterval(() => {
          if (Math.random() < .55) return;
          const c = ac.createBufferSource();
          c.buffer = noiseBuf();
          const cf = ac.createBiquadFilter(); cf.type = 'highpass'; cf.frequency.value = 2400;
          const cg = ac.createGain();
          const t = ac.currentTime;
          cg.gain.setValueAtTime(.0001, t);
          cg.gain.exponentialRampToValueAtTime(.25 + Math.random() * .3, t + .012);
          cg.gain.exponentialRampToValueAtTime(.0001, t + .07);
          c.connect(cf); cf.connect(cg); cg.connect(master);
          c.start(t); c.stop(t + .09);
        }, 140);
      }
      src.start();
      nodes.push(src, f, g);
      active = id;
      const s = SCENES.find(x => x.id === id);
      curEl.textContent = s.ic + ' 正在播放 · ' + s.nm;
      $$('.nz-card', body).forEach(c => c.classList.toggle('on', c.dataset.s === id));
    }
    function toggle(id) {
      if (active === id) {
        stopAll(); active = null;
        curEl.textContent = '已停止 · 选一个场景吧';
        $$('.nz-card', body).forEach(c => c.classList.remove('on'));
      } else play(id);
    }
    $$('.nz-card', body).forEach(c => c.addEventListener('click', () => toggle(c.dataset.s)));
    volEl.addEventListener('input', () => { if (master) master.gain.value = volEl.value / 100 * .8; });
    win.cleanup.push(() => { stopAll(); if (ac) try { ac.close(); } catch (e) {} });
  }
});

/* ================= 系统初始化 ================= */
function init() {
  WM.init();
  State.load();
  FS.load();
  applyTheme();
  applyAccent();
  applyWall();
  StartMenu.init();
  TrayPop.init();
  Shell.init();
  Desktop.refresh();
  function tickClock() {
    const n = new Date();
    const pad = v => String(v).padStart(2, '0');
    $('#tk-time').textContent = pad(n.getHours()) + ':' + pad(n.getMinutes());
    $('#tk-day').textContent = (n.getMonth() + 1) + '月' + n.getDate() + '日 ' + ['周日', '周一', '周二', '周三', '周四', '周五', '周六'][n.getDay()];
  }
  tickClock();
  setInterval(tickClock, 1000);
  window.addEventListener('resize', () => {
    WM.wins.forEach(w => {
      if (w.maximized) {
        w.rect = { x: 0, y: 0, w: innerWidth, h: innerHeight - 56 };
        WM.place(w);
        if (typeof w.onResize === 'function') w.onResize();
      }
    });
  });
  Boot.play();
}
if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', init);
else init();
</script>
